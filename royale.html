<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>👑 Clash Royale</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #app { width: 100%; max-width: 450px; height: 100vh; max-height: 850px; background: #000; position: relative; overflow: hidden; border-radius: 12px; border: 3px solid #444; }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; z-index: 10; pointer-events: none; }
        .screen.active { display: flex; }
        .solid-bg { background: radial-gradient(circle at top, #2b324d, #1a1d29); pointer-events: auto; }
        .interactive { pointer-events: auto; }
        
        h1 { font-size: 48px; margin: 40px 0 10px; background: linear-gradient(to bottom, #fff, #999); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; line-height: 1.1; }
        h2 { margin-top: 40px; font-size: 28px; }
        
        .btn {
            background: linear-gradient(180deg, #4facfe, #00f2fe); border: none; border-bottom: 6px solid #009eb3; border-radius: 15px;
            color: #fff; font-size: 20px; font-weight: 900; padding: 18px; width: 80%; margin: 10px; cursor: pointer; pointer-events: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: center;
        }
        .btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        .btn-gold { background: linear-gradient(180deg, #f0932b, #f6e58d); border-bottom-color: #b33939; color: #3e2723; }
        .btn-red { background: linear-gradient(180deg, #ff4757, #ff6b81); border-bottom-color: #c0392b; }
        .btn-small { width: auto; padding: 10px 25px; font-size: 14px; margin: 5px; }
        
        .lab-box { width: 90%; background: #2f3640; padding: 15px; border-radius: 15px; margin-top: 20px; pointer-events: auto; max-height: 300px; overflow-y: auto; }
        .deck-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 95%; margin-top: 10px; max-height: 350px; overflow-y: auto; pointer-events: auto; padding-bottom: 20px; }
        .card-item { background: #1e272e; border: 2px solid #000; border-radius: 8px; height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; text-align: center; }
        .card-item.in-deck { border-color: #2ecc71; background: #2f3542; box-shadow: 0 0 10px rgba(46,204,113,0.3); }
        .card-item.locked { opacity: 0.4; filter: grayscale(1); }
        .stats { font-size: 9px; color: #ccc; text-align: center; margin-top: 3px; }
        
        .top-ui { position: absolute; top: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: flex-start; box-sizing: border-box; z-index: 5; }
        .enemy-info { display: flex; flex-direction: column; }
        .timer { font-size: 28px; font-weight: 900; background: rgba(0,0,0,0.7); padding: 5px 18px; border-radius: 20px; text-shadow: 2px 2px 0 black; }
        .surrender-btn { background: rgba(255,0,0,0.6); border: 2px solid #ff4757; color: white; font-size: 18px; padding: 5px 12px; border-radius: 10px; cursor: pointer; pointer-events: auto; }
        
        .bottom-ui { position: absolute; bottom: 0; width: 100%; height: 175px; background: linear-gradient(to top, #1e272e 85%, transparent); display: flex; flex-direction: column; align-items: center; z-index: 5; }
        .elixir-bar { width: 90%; height: 20px; background: #111; border-radius: 10px; border: 2px solid #555; position: relative; margin-top: 28px; overflow: hidden; }
        .elixir-fill { height: 100%; background: linear-gradient(90deg, #8b2fc9, #c24eff); border-radius: 8px; transition: width 0.1s linear; box-shadow: 0 0 10px #c24eff; }
        .elixir-text { position: absolute; right: 15px; top: -22px; font-weight: bold; font-size: 16px; color: #eac4ff; }
        .hand { display: flex; gap: 10px; margin-top: 12px; pointer-events: auto; }
        .battle-card { width: 75px; height: 100px; background: #353b48; border: 3px solid #111; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; position: relative; }
        .battle-card.selected { transform: translateY(-20px); border-color: #f1c40f; background: #57606f; box-shadow: 0 0 20px rgba(241,196,15,0.5); }
        .battle-card.disabled { opacity: 0.4; filter: grayscale(1); pointer-events: none; }
        .card-name { font-size: 9px; color: white; width: 90%; text-align: center; white-space: nowrap; overflow: hidden; margin-top: 5px; }
        .card-cost { position: absolute; top: -8px; right: -8px; background: #f1c40f; border-radius: 50%; width: 24px; height: 24px; text-align: center; font-weight: bold; color: black; font-size: 13px; line-height: 24px; border: 2px solid #000; }
        
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: none; justify-content: center; align-items: center; flex-direction: column; pointer-events: auto; }
        .modal.active { display: flex !important; }
        
        .msg { position: absolute; top: 120px; width: 100%; text-align: center; color: #f1c40f; font-weight: bold; font-size: 20px; text-shadow: 0 2px 0 black; pointer-events: none; z-index: 50; }
        .settings-inp { padding: 12px; width: 70%; text-align: center; margin: 20px 0; font-size: 16px; border-radius: 10px; border: none; background: #2f3640; color: white; pointer-events: auto; }
        
        .emoji-panel { display: none; position: absolute; bottom: 180px; right: 10px; gap: 8px; background: #1f2330; padding: 10px; border-radius: 15px; z-index: 50; }
        .emoji-panel.show { display: flex; }
        .emoji-item { font-size: 28px; cursor: pointer; padding: 4px; pointer-events: auto; }
        .emoji-btn { background: #3b4055; border: none; font-size: 24px; border-radius: 12px; padding: 8px 14px; cursor: pointer; pointer-events: auto; margin-left: 5px; }
    </style>
</head>
<body>

<div id="app">
    <canvas id="canvas" width="450" height="850"></canvas>
    <div id="msg-box" class="msg"></div>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="menu" class="screen solid-bg active">
        <h1>CLASH<br>ROYALE</h1>
        <p id="net-stat" style="color:#aaa; font-size:12px; font-weight:bold; margin:5px 0;">Подключение...</p>
        
        <button class="btn btn-gold" onclick="nav('deck-screen')">🗂 КОЛОДА</button>
        <button class="btn btn-red" onclick="startSearch()">⚡ В БОЙ</button>
        <button class="btn" style="background:#444;" onclick="nav('settings')">👤 ПРОФИЛЬ</button>
        
        <p id="search-status" style="color:#f1c40f; font-weight:bold; margin-top:10px; display:none;">🔍 Поиск соперника...</p>
    </div>

    <!-- КОЛОДА -->
    <div id="deck-screen" class="screen solid-bg">
        <h2 style="color:#f1c40f;">Моя Колода</h2>
        <div class="lab-box" id="deck-container"></div>
        <div style="display:flex; justify-content:space-between; width:90%; margin-top:10px; pointer-events:auto;">
            <span>Выбрано: <span id="deck-count">0</span>/5</span>
            <button class="btn btn-red btn-small" onclick="nav('menu')">НАЗАД</button>
        </div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="settings" class="screen solid-bg">
        <h2 style="color:#3498db;">Профиль</h2>
        <p>Никнейм:</p>
        <input id="inp-nick" class="settings-inp" placeholder="Игрок" maxlength="16">
        <div style="font-size:28px; font-weight:bold; color:#f1c40f; margin:15px 0;">🏆 <span id="cups-display">0</span></div>
        <button class="btn" onclick="saveProfile()">СОХРАНИТЬ</button>
        <button class="btn btn-red" style="margin-top:20px;" onclick="nav('menu')">НАЗАД</button>
    </div>

    <!-- ИГРА -->
    <div id="game" class="screen">
        <div class="top-ui">
            <div class="enemy-info">
                <span style="font-weight:bold; font-size:15px;" id="enemy-name">👤 Противник</span>
                <span style="font-size:12px; color:#f1c40f;" id="enemy-cups">🏆 0</span>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
                <div class="timer" id="timer">2:00</div>
                <button class="surrender-btn" onclick="surrender()">🏳️ Сдаться</button>
            </div>
        </div>
        <div class="bottom-ui">
            <div class="elixir-bar">
                <div class="elixir-fill" id="elixir-fill" style="width:0%;"></div>
                <div class="elixir-text">💧 <span id="elixir-num">0</span></div>
            </div>
            <div style="display:flex; align-items:center; gap:5px; width:95%; justify-content:center;">
                <div class="hand" id="hand"></div>
                <button class="emoji-btn" onclick="toggleEmoji()">💬</button>
            </div>
        </div>
        <div class="emoji-panel" id="emoji-panel">
            <span class="emoji-item" onclick="sendEmoji('👍')">👍</span>
            <span class="emoji-item" onclick="sendEmoji('👎')">👎</span>
            <span class="emoji-item" onclick="sendEmoji('❤️')">❤️</span>
            <span class="emoji-item" onclick="sendEmoji('😭')">😭</span>
            <span class="emoji-item" onclick="sendEmoji('🤣')">🤣</span>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div id="modal" class="modal">
        <h2 id="modal-title" style="font-size:36px; margin-bottom:10px;">ПОИСК...</h2>
        <p id="modal-text" style="color:#ccc; margin-bottom:20px; font-size:18px;">Ждём соперника...</p>
        <button class="btn btn-red" id="modal-btn" onclick="quitToMenu()">В МЕНЮ</button>
    </div>
</div>

<script>
// ============ ДАННЫЕ ЮНИТОВ (все разблокированы) ============
const ALL_UNITS = [
    { id: 'knight', name: 'Рыцарь', icon: '⚔️', hp: 700, dmg: 90, speed: 0.8, size: 16, color: '#4a90d9', attackSpeed: 1.2, cost: 3, targets: 'all' },
    { id: 'archer', name: 'Лучница', icon: '🏹', hp: 300, dmg: 65, speed: 0.7, size: 12, color: '#5cb85c', attackSpeed: 1.0, cost: 2, targets: 'all' },
    { id: 'giant', name: 'Гигант', icon: '🛡️', hp: 2000, dmg: 55, speed: 0.4, size: 22, color: '#8b6914', attackSpeed: 1.5, cost: 5, targets: 'buildings' },
    { id: 'goblin', name: 'Гоблин', icon: '👺', hp: 180, dmg: 55, speed: 1.2, size: 10, color: '#32cd32', attackSpeed: 0.8, cost: 1, targets: 'all' },
    { id: 'wizard', name: 'Маг', icon: '🧙', hp: 450, dmg: 120, speed: 0.6, size: 14, color: '#9b59b6', attackSpeed: 1.3, cost: 4, targets: 'all' },
    { id: 'minipekka', name: 'Мини Пекка', icon: '🤖', hp: 800, dmg: 200, speed: 0.9, size: 15, color: '#34495e', attackSpeed: 1.4, cost: 3, targets: 'all' },
    { id: 'skeleton', name: 'Скелет', icon: '💀', hp: 120, dmg: 50, speed: 1.0, size: 9, color: '#ecf0f1', attackSpeed: 0.7, cost: 1, targets: 'all' },
    { id: 'dragon', name: 'Дракон', icon: '🐉', hp: 600, dmg: 100, speed: 0.7, size: 18, color: '#e74c3c', attackSpeed: 1.1, cost: 4, targets: 'all' },
    { id: 'prince', name: 'Принц', icon: '🐴', hp: 700, dmg: 150, speed: 1.0, size: 17, color: '#f39c12', attackSpeed: 1.3, cost: 4, targets: 'all' },
    { id: 'bomber', name: 'Бомбер', icon: '💣', hp: 220, dmg: 110, speed: 0.5, size: 13, color: '#2c3e50', attackSpeed: 1.6, cost: 2, targets: 'all' }
];

// ============ СОСТОЯНИЕ ============
let deck = [0,1,2,3,4]; // Индексы выбранных юнитов
let battleHand = [];
let queueCard = null;
let selectedCard = null;
let elixir = 0;
let maxElixir = 10;
let gameTime = 120;
let suddenDeath = false;
let matchActive = false;
let playerNick = 'Игрок';
let opponentNick = 'Противник';
let opponentCups = 0;
let cups = 0;
let myTowers = [];
let enemyTowers = [];
let myUnits = [];
let enemyUnits = [];
let playerId = null;
let ws = null;
let searching = false;
let lastStateUpdate = 0;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let animFrame = null;
let lastTime = 0;

const BRIDGES = [{ x: 80, y: 380, w: 50, h: 40 }, { x: 320, y: 380, w: 50, h: 40 }];
const RIVER_Y = 380;
const RIVER_H = 40;

// ============ ПРОФИЛЬ ============
function loadProfile() {
    playerNick = localStorage.getItem('crNick') || 'Игрок';
    cups = parseInt(localStorage.getItem('crCups') || '0');
    playerId = localStorage.getItem('crId');
    if (!playerId) { playerId = 'p_' + Math.random().toString(36).substr(2,9); localStorage.setItem('crId', playerId); }
    document.getElementById('inp-nick').value = playerNick;
    document.getElementById('cups-display').textContent = cups;
}
function saveProfile() {
    playerNick = document.getElementById('inp-nick').value.trim() || 'Игрок';
    localStorage.setItem('crNick', playerNick);
    localStorage.setItem('crCups', cups);
    document.getElementById('cups-display').textContent = cups;
    nav('menu');
}

// ============ НАВИГАЦИЯ ============
function nav(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'deck-screen') renderDeckScreen();
    if (id === 'menu') { matchActive = false; if(animFrame) cancelAnimationFrame(animFrame); }
}

// ============ КОЛОДА ============
function renderDeckScreen() {
    const container = document.getElementById('deck-container');
    container.innerHTML = '';
    document.getElementById('deck-count').textContent = deck.length;
    
    ALL_UNITS.forEach((unit, i) => {
        const card = document.createElement('div');
        card.className = 'card-item' + (deck.includes(i) ? ' in-deck' : '');
        card.innerHTML = `
            <div style="font-size:35px;">${unit.icon}</div>
            <div style="font-weight:bold; font-size:11px;">${unit.name}</div>
            <div class="stats">HP:${unit.hp} DMG:${unit.dmg} 💰${unit.cost}</div>
        `;
        card.onclick = () => {
            if (deck.includes(i)) {
                if (deck.length <= 5) return;
                deck = deck.filter(x => x !== i);
            } else {
                if (deck.length >= 5) deck.shift();
                deck.push(i);
            }
            renderDeckScreen();
        };
        container.appendChild(card);
    });
}

// ============ WEBSOCKET ============
function connectWS() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${location.host}`);
    
    ws.onopen = () => {
        document.getElementById('net-stat').textContent = '✅ ОНЛАЙН';
        document.getElementById('net-stat').style.color = '#2ecc71';
        send({ type: 'setId', id: playerId, nick: playerNick, cups });
    };
    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'matchFound') { opponentNick = msg.opponentNick; opponentCups = msg.opponentCups; startBattle(); }
        if (msg.type === 'gameState') updateRemote(msg);
        if (msg.type === 'emoji') showEnemyEmoji(msg.emoji);
        if (msg.type === 'battleEnd') endBattle(msg.result);
    };
    ws.onclose = () => { document.getElementById('net-stat').textContent = '🔴 ОФФЛАЙН'; document.getElementById('net-stat').style.color = '#e74c3c'; setTimeout(connectWS, 2000); };
}
function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

// ============ ПОИСК ============
function startSearch() {
    if (deck.length < 5) return showMsg('Выберите 5 юнитов в колоде!');
    if (!ws || ws.readyState !== WebSocket.OPEN) { connectWS(); setTimeout(startSearch, 600); return; }
    searching = true;
    document.getElementById('search-status').style.display = 'block';
    send({ type: 'findMatch', nick: playerNick, cups });
}
function showMsg(t) { const m = document.getElementById('msg-box'); m.textContent = t; setTimeout(() => m.textContent = '', 2000); }

// ============ БОЙ ============
function startBattle() {
    document.getElementById('search-status').style.display = 'none';
    searching = false;
    nav('game');
    
    battleHand = deck.slice(0, 4).map(i => ({...ALL_UNITS[i], attackTimer: 0}));
    queueCard = {...ALL_UNITS[deck[4]], attackTimer: 0};
    elixir = 0;
    gameTime = 120;
    suddenDeath = false;
    matchActive = true;
    myUnits = [];
    enemyUnits = [];
    selectedCard = null;
    lastStateUpdate = Date.now();
    
    document.getElementById('enemy-name').textContent = '👤 ' + opponentNick;
    document.getElementById('enemy-cups').textContent = '🏆 ' + opponentCups;
    document.getElementById('timer').textContent = '2:00';
    document.getElementById('elixir-fill').style.width = '0%';
    document.getElementById('elixir-num').textContent = '0';
    
    renderHand();
    
    // Башни: мои снизу, врага сверху
    myTowers = [
        { x: 85, y: 710, w: 30, h: 30, hp: 800, maxHp: 800, type: 'side', team: 0 },
        { x: 200, y: 740, w: 50, h: 45, hp: 1500, maxHp: 1500, type: 'main', team: 0, isKing: true },
        { x: 335, y: 710, w: 30, h: 30, hp: 800, maxHp: 800, type: 'side', team: 0 }
    ];
    enemyTowers = [
        { x: 85, y: 110, w: 30, h: 30, hp: 800, maxHp: 800, type: 'side', team: 1 },
        { x: 200, y: 60, w: 50, h: 45, hp: 1500, maxHp: 1500, type: 'main', team: 1, isKing: true },
        { x: 335, y: 110, w: 30, h: 30, hp: 800, maxHp: 800, type: 'side', team: 1 }
    ];
    
    if (animFrame) cancelAnimationFrame(animFrame);
    lastTime = performance.now();
    animFrame = requestAnimationFrame(loop);
}

function renderHand() {
    const hand = document.getElementById('hand');
    hand.innerHTML = '';
    battleHand.forEach((card, i) => {
        const el = document.createElement('div');
        el.className = 'battle-card';
        el.innerHTML = `<div style="font-size:32px;">${card.icon}</div><div class="card-name">${card.name}</div><div class="card-cost">${card.cost}</div>`;
        el.onclick = () => {
            if (elixir < card.cost) return;
            if (selectedCard === i) { selectedCard = null; el.classList.remove('selected'); }
            else { document.querySelectorAll('.battle-card').forEach(x => x.classList.remove('selected')); selectedCard = i; el.classList.add('selected'); }
        };
        if (card.cost > elixir) el.classList.add('disabled');
        hand.appendChild(el);
    });
}

canvas.addEventListener('click', (e) => {
    if (!matchActive || selectedCard === null) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (450 / rect.width);
    const y = (e.clientY - rect.top) * (850 / rect.height);
    
    if (y < RIVER_Y + RIVER_H) return;
    
    const card = battleHand[selectedCard];
    if (elixir < card.cost) return;
    
    elixir -= card.cost;
    const unit = {...card, id: Math.random().toString(36), x, y, hp: card.hp, maxHp: card.hp, team: 0, attackTimer: 0, owner: 'player'};
    myUnits.push(unit);
    
    const used = battleHand[selectedCard];
    battleHand.splice(selectedCard, 1);
    battleHand.push(queueCard);
    queueCard = used;
    selectedCard = null;
    renderHand();
    
    send({ type: 'placeUnit', unit: {...card, id: unit.id}, x, y });
});

function updateRemote(msg) {
    if (!matchActive) return;
    if (msg.enemyUnits) enemyUnits = msg.enemyUnits.map(u => ({...u, attackTimer: u.attackTimer || 0, team: 1, owner: 'enemy'}));
    if (msg.towers) {
        if (msg.towers.player) myTowers = msg.towers.player;
        if (msg.towers.enemy) enemyTowers = msg.towers.enemy.map(t => ({...t, team: 1}));
    }
}

// ============ ЭМОДЗИ ============
function toggleEmoji() {
    document.getElementById('emoji-panel').classList.toggle('show');
}
function sendEmoji(emoji) {
    send({ type: 'emoji', emoji });
    document.getElementById('emoji-panel').classList.remove('show');
    // Показать над своей главной башней
    const main = myTowers.find(t => t.isKing);
    if (main) main.emoji = { symbol: emoji, time: 2 };
}
function showEnemyEmoji(emoji) {
    const main = enemyTowers.find(t => t.isKing);
    if (main) main.emoji = { symbol: emoji, time: 2 };
}

// ============ ИГРОВОЙ ЦИКЛ ============
function loop(ts) {
    if (!matchActive) return;
    const dt = Math.min((ts - lastTime) / 1000, 0.1);
    lastTime = ts;
    
    gameTime -= dt;
    if (gameTime <= 0) {
        if (!suddenDeath && bothKingsAlive()) { suddenDeath = true; gameTime = 60; }
        else { endByTimeout(); return; }
    }
    
    const rate = suddenDeath ? 0.56 : 0.28;
    elixir = Math.min(maxElixir, elixir + rate * dt);
    
    updateAllUnits([...myUnits, ...enemyUnits], dt);
    myUnits = myUnits.filter(u => u.hp > 0);
    enemyUnits = enemyUnits.filter(u => u.hp > 0);
    myTowers = myTowers.filter(t => t.hp > 0);
    enemyTowers = enemyTowers.filter(t => t.hp > 0);
    
    checkWin();
    draw();
    updateHUD();
    
    if (Date.now() - lastStateUpdate > 200) {
        lastStateUpdate = Date.now();
        send({ type: 'stateUpdate', units: myUnits, towers: { player: myTowers } });
    }
    
    animFrame = requestAnimationFrame(loop);
}

function updateAllUnits(units, dt) {
    units.forEach(u => {
        if (u.hp <= 0) return;
        if (u.attackTimer > 0) u.attackTimer -= dt;
        
        const enemies = units.filter(e => e.team !== u.team && e.hp > 0);
        const towers = (u.team === 0 ? enemyTowers : myTowers).filter(t => t.hp > 0);
        
        let target = null, minDist = 150;
        if (u.targets !== 'buildings') {
            enemies.forEach(e => { const d = Math.hypot(e.x - u.x, e.y - u.y); if (d < minDist) { minDist = d; target = e; } });
        }
        if (!target) {
            minDist = Infinity;
            towers.forEach(t => { const d = Math.hypot(t.x + t.w/2 - u.x, t.y + t.h/2 - u.y); if (d < minDist) { minDist = d; target = t; } });
        }
        if (!target) return;
        
        const tx = target.w ? target.x + target.w/2 : target.x;
        const ty = target.w ? target.y + target.h/2 : target.y;
        const dist = Math.hypot(tx - u.x, ty - u.y);
        
        if (dist > 35) {
            moveToTarget(u, tx, ty, dt);
        } else if (u.attackTimer <= 0) {
            target.hp -= u.dmg;
            u.attackTimer = u.attackSpeed;
        }
    });
}

function moveToTarget(u, tx, ty, dt) {
    let nx = tx, ny = ty;
    const crossing = (u.y > RIVER_Y + RIVER_H && ny < RIVER_Y) || (u.y < RIVER_Y && ny > RIVER_Y + RIVER_H);
    
    if (crossing) {
        let onBridge = false;
        for (const b of BRIDGES) {
            if (u.x > b.x - 20 && u.x < b.x + b.w + 20) { onBridge = true; break; }
        }
        if (!onBridge) {
            let best = BRIDGES[0];
            if (Math.abs(u.x - BRIDGES[1].x) < Math.abs(u.x - BRIDGES[0].x)) best = BRIDGES[1];
            nx = best.x + best.w/2;
            ny = u.y;
        }
    }
    
    const angle = Math.atan2(ny - u.y, nx - u.x);
    u.x += Math.cos(angle) * u.speed * 60 * dt;
    u.y += Math.sin(angle) * u.speed * 60 * dt;
}

function bothKingsAlive() {
    return myTowers.some(t => t.isKing && t.hp > 0) && enemyTowers.some(t => t.isKing && t.hp > 0);
}
function checkWin() {
    if (!enemyTowers.some(t => t.isKing)) endBattle('win');
    if (!myTowers.some(t => t.isKing)) endBattle('lose');
}
function endByTimeout() {
    const myKing = myTowers.find(t => t.isKing);
    const enKing = enemyTowers.find(t => t.isKing);
    if (!myKing || !enKing) { endBattle('draw'); return; }
    if (myKing.hp > enKing.hp) endBattle('win');
    else if (enKing.hp > myKing.hp) endBattle('lose');
    else endBattle('draw');
}
function endBattle(result) {
    if (!matchActive) return;
    matchActive = false;
    if (animFrame) cancelAnimationFrame(animFrame);
    
    let change = 0;
    if (result === 'win') { cups += 30; change = 30; }
    else if (result === 'lose') { cups = Math.max(0, cups - 25); change = -25; }
    localStorage.setItem('crCups', cups);
    
    document.getElementById('modal-title').textContent = result === 'win' ? '🏆 ПОБЕДА!' : result === 'lose' ? '💔 ПОРАЖЕНИЕ' : '🤝 НИЧЬЯ';
    document.getElementById('modal-text').textContent = `${playerNick} 🏆${cups} (${change>0?'+':''}${change}) vs ${opponentNick}`;
    document.getElementById('modal-btn').textContent = 'В МЕНЮ';
    document.getElementById('modal-btn').onclick = quitToMenu;
    document.getElementById('modal').classList.add('active');
    
    send({ type: 'battleEnd', result });
}
function surrender() {
    if (matchActive) endBattle('lose');
}
function quitToMenu() {
    document.getElementById('modal').classList.remove('active');
    matchActive = false;
    if (animFrame) cancelAnimationFrame(animFrame);
    nav('menu');
}

// ============ ОТРИСОВКА ============
function draw() {
    ctx.clearRect(0, 0, 450, 850);
    
    // Трава
    ctx.fillStyle = '#3a5a3a';
    ctx.fillRect(0, 0, 450, 850);
    
    // Река
    ctx.fillStyle = '#2f6f8f';
    ctx.fillRect(0, RIVER_Y, 450, RIVER_H);
    
    // Мосты
    BRIDGES.forEach(b => {
        ctx.fillStyle = '#8b6914';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#5c4a1e';
        ctx.lineWidth = 2;
        for (let i = 0; i < b.h; i += 6) { ctx.beginPath(); ctx.moveTo(b.x, b.y + i); ctx.lineTo(b.x + b.w, b.y + i); ctx.stroke(); }
        ctx.strokeRect(b.x, b.y, b.w, b.h);
    });
    
    // Подсветка своей половины при выборе карты
    if (selectedCard !== null) {
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(0, RIVER_Y + RIVER_H, 450, 850 - RIVER_Y - RIVER_H);
    }
    
    // Башни врага
    enemyTowers.forEach(t => drawTower(t));
    // Башни игрока
    myTowers.forEach(t => drawTower(t));
    
    // Юниты (сортировка по Y)
    [...myUnits, ...enemyUnits].sort((a, b) => a.y - b.y).forEach(u => {
        if (u.hp <= 0) return;
        // Круг
        ctx.beginPath();
        ctx.arc(u.x, u.y, u.size, 0, Math.PI * 2);
        ctx.fillStyle = u.team === 0 ? '#4a90d9' : '#e74c3c';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Иконка
        ctx.fillStyle = 'white';
        ctx.font = `${u.size}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(u.icon, u.x, u.y);
        
        // HP
        const hpPct = u.hp / u.maxHp;
        ctx.fillStyle = '#333';
        ctx.fillRect(u.x - u.size, u.y - u.size - 12, u.size * 2, 4);
        ctx.fillStyle = u.team === 0 ? '#2ecc71' : '#e74c3c';
        ctx.fillRect(u.x - u.size, u.y - u.size - 12, u.size * 2 * hpPct, 4);
        
        // Имя
        ctx.fillStyle = 'white';
        ctx.font = 'bold 8px Arial';
        ctx.fillText(u.name, u.x, u.y + u.size + 12);
    });
}

function drawTower(t) {
    if (t.hp <= 0) return;
    const x = t.x, y = t.y, w = t.w, h = t.h;
    const team = t.team !== undefined ? t.team : (t.owner === 'player' ? 0 : 1);
    const c1 = team === 0 ? '#4a7db0' : '#c94b4b';
    const c2 = team === 0 ? '#5a8dc0' : '#d95b5b';
    
    // Камень
    ctx.fillStyle = '#95a5a6';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    
    // Крыша
    ctx.fillStyle = c1;
    ctx.fillRect(x - 3, y - 10, w + 6, 12);
    
    // Зубцы
    ctx.fillStyle = c2;
    for (let i = 0; i < 5; i++) ctx.fillRect(x + i * (w / 5), y - 16, w / 5 - 2, 8);
    
    if (t.isKing) {
        ctx.fillStyle = 'white';
        ctx.font = '22px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('👑', x + w / 2, y - 22);
    }
    
    // HP
    const hpPct = t.hp / t.maxHp;
    ctx.fillStyle = '#333';
    ctx.fillRect(x - 2, y + h + 4, w + 4, 6);
    ctx.fillStyle = team === 0 ? '#2ecc71' : '#e74c3c';
    ctx.fillRect(x - 2, y + h + 4, (w + 4) * hpPct, 6);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 9px Arial';
    ctx.fillText(Math.ceil(t.hp), x + w / 2, y + h + 14);
    
    // Эмодзи
    if (t.emoji && t.emoji.time > 0) {
        ctx.font = '26px Arial';
        ctx.fillText(t.emoji.symbol, x + w / 2, y - 30);
        t.emoji.time -= 0.016;
    }
}

function updateHUD() {
    const m = Math.floor(gameTime / 60), s = Math.floor(gameTime % 60);
    document.getElementById('timer').textContent = `${m}:${String(s).padStart(2, '0')}`;
    document.getElementById('elixir-num').textContent = Math.floor(elixir);
    document.getElementById('elixir-fill').style.width = (elixir / maxElixir * 100) + '%';
    
    // Обновить состояние карт
    document.querySelectorAll('.battle-card').forEach((el, i) => {
        if (battleHand[i] && battleHand[i].cost > elixir) el.classList.add('disabled');
        else el.classList.remove('disabled');
    });
}

loadProfile();
connectWS();
