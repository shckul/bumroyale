<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>👑 Royale Clone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    body {
      background: #1a1e2b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
    }
    #game-container {
      width: 100%;
      max-width: 420px;
      height: 700px;
      background: linear-gradient(145deg, #2a2f3f, #1f2230);
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      border: 2px solid #40495a;
    }
    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      padding: 16px;
      color: #f0e6d2;
    }
    .screen.active {
      display: flex;
    }
    .main-menu {
      gap: 20px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      background: #232837;
      padding: 6px;
      border-radius: 24px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 5px;
      background: transparent;
      border: none;
      color: #9aa0b4;
      font-weight: bold;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: #4f5b72;
      color: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .panel {
      background: #232837;
      border-radius: 20px;
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .unit-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .unit-card {
      background: #2f354a;
      border-radius: 12px;
      padding: 6px;
      text-align: center;
      font-size: 12px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: 0.2s;
    }
    .unit-card.selected {
      border-color: #f7c948;
      background: #4a432f;
    }
    .unit-icon {
      font-size: 28px;
      display: block;
    }
    .queue-preview {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
      font-size: 13px;
      background: #2a2f40;
      padding: 8px;
      border-radius: 12px;
    }
    .fight-btn {
      background: #e85d3a;
      border: none;
      color: white;
      font-weight: bold;
      padding: 18px;
      border-radius: 24px;
      font-size: 22px;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 6px 0 #8f2e1c;
      transition: 0.1s linear;
      margin-top: 10px;
    }
    .fight-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #8f2e1c;
    }
    .fight-btn:disabled {
      background: #666;
      box-shadow: 0 6px 0 #444;
      cursor: not-allowed;
    }
    .search-status {
      color: #f7c948;
      text-align: center;
      margin-top: 10px;
      display: none;
    }
    .profile-input {
      background: #2f354a;
      border: none;
      padding: 14px;
      border-radius: 16px;
      color: white;
      font-size: 16px;
      outline: none;
    }
    .cups-display {
      font-size: 28px;
      font-weight: bold;
      color: #f7c948;
    }
    .battle-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
      font-weight: bold;
      font-size: 14px;
    }
    .timer {
      background: #1e212b;
      padding: 4px 18px;
      border-radius: 20px;
      font-size: 18px;
      color: #ffd966;
    }
    canvas {
      width: 100%;
      border-radius: 16px;
      background: #2b4a3b;
      display: block;
      margin: 4px 0;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    .elixir-bar-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
    }
    .elixir-fill {
      height: 14px;
      background: #c24eff;
      border-radius: 10px;
      width: 0%;
      box-shadow: 0 0 12px #c24eff;
    }
    .elixir-bg {
      flex: 1;
      background: #2a2f3f;
      height: 14px;
      border-radius: 10px;
      overflow: hidden;
    }
    .elixir-number {
      font-weight: bold;
      color: #eac4ff;
      min-width: 45px;
    }
    .hand-cards {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 4px 0;
    }
    .card-slot {
      background: #2d3245;
      border-radius: 12px;
      padding: 6px 8px;
      text-align: center;
      width: 65px;
      border: 2px solid #5a5f72;
      transition: 0.2s;
      cursor: pointer;
    }
    .card-slot.highlight {
      border-color: #f7c948;
      box-shadow: 0 0 12px gold;
    }
    .emoji-btn {
      background: #3b4055;
      border: none;
      font-size: 22px;
      border-radius: 14px;
      padding: 6px 14px;
      cursor: pointer;
    }
    .emoji-panel {
      display: none;
      gap: 8px;
      background: #1f2330;
      padding: 10px;
      border-radius: 20px;
      position: absolute;
      bottom: 140px;
      right: 16px;
      z-index: 20;
    }
    .emoji-item {
      font-size: 26px;
      cursor: pointer;
    }
    .result-screen {
      justify-content: center;
      align-items: center;
      gap: 24px;
    }
  </style>
</head>
<body>
<div id="game-container">
  <!-- Главное меню -->
  <div id="mainMenu" class="screen active main-menu">
    <div class="tabs">
      <button class="tab-btn active" data-tab="deck">🗂 Колода</button>
      <button class="tab-btn" data-tab="battle">⚔️ Бой</button>
      <button class="tab-btn" data-tab="profile">👤 Профиль</button>
    </div>
    <div id="tabDeck" class="panel">
      <div class="unit-grid" id="unitGrid"></div>
      <div class="queue-preview" id="queuePreview"></div>
    </div>
    <div id="tabBattle" class="panel" style="display: none;">
      <button id="findMatchBtn" class="fight-btn">⚡ В БОЙ</button>
      <p id="searchStatus" class="search-status">🔍 Поиск соперника...</p>
    </div>
    <div id="tabProfile" class="panel" style="display: none;">
      <input type="text" id="nicknameInput" class="profile-input" placeholder="Введи никнейм" maxlength="16">
      <div class="cups-display">🏆 <span id="cupsCount">0</span></div>
      <button id="saveProfileBtn" style="background:#4f5b72; border:none; color:white; padding:12px; border-radius:16px;">Сохранить</button>
    </div>
  </div>

  <!-- Экран боя -->
  <div id="battleScreen" class="screen" style="padding:8px;">
    <div class="battle-hud">
      <span id="enemyInfo">⚔️ Противник</span>
      <span class="timer" id="timerDisplay">2:00</span>
    </div>
    <canvas id="battleCanvas" width="400" height="380"></canvas>
    <div class="elixir-bar-container">
      <span>💧</span>
      <div class="elixir-bg"><div id="elixirFill" class="elixir-fill" style="width: 50%;"></div></div>
      <span class="elixir-number" id="elixirValue">5.0</span>
      <button id="emojiToggle" class="emoji-btn">💬</button>
    </div>
    <div class="hand-cards" id="handCards"></div>
    <div class="emoji-panel" id="emojiPanel">
      <span class="emoji-item">👍</span><span class="emoji-item">👎</span><span class="emoji-item">❤️</span>
      <span class="emoji-item">😭</span><span class="emoji-item">🤣</span>
    </div>
  </div>

  <!-- Экран результата -->
  <div id="resultScreen" class="screen result-screen">
    <h2 id="resultTitle"></h2>
    <p id="resultCups"></p>
    <button id="exitResultBtn" style="background:#e85d3a; border:none; color:white; padding:14px 32px; border-radius:24px; font-weight:bold;">ВЫХОД</button>
  </div>
</div>

<script>
  (function() {
    // ---------- ДАННЫЕ ЮНИТОВ ----------
    const ALL_UNITS = [
      { id: 'knight', name: 'Рыцарь', cost: 3, icon: '⚔️', hp: 600, dmg: 80, speed: 1.2 },
      { id: 'archer', name: 'Лучница', cost: 2, icon: '🏹', hp: 250, dmg: 60, speed: 1.0 },
      { id: 'giant', name: 'Гигант', cost: 5, icon: '🛡️', hp: 1500, dmg: 50, speed: 0.7 },
      { id: 'goblin', name: 'Гоблин', cost: 1, icon: '👺', hp: 150, dmg: 50, speed: 1.8 },
      { id: 'wizard', name: 'Маг', cost: 4, icon: '🧙', hp: 400, dmg: 110, speed: 0.9 },
      { id: 'minipekka', name: 'Мини Пекка', cost: 3, icon: '🤖', hp: 700, dmg: 180, speed: 1.1 },
      { id: 'skeleton', name: 'Скелет', cost: 1, icon: '💀', hp: 100, dmg: 45, speed: 1.5 },
      { id: 'dragon', name: 'Дракон', cost: 4, icon: '🐉', hp: 550, dmg: 90, speed: 1.0 },
      { id: 'prince', name: 'Принц', cost: 4, icon: '🐴', hp: 650, dmg: 140, speed: 1.3 },
      { id: 'bomber', name: 'Бомбер', cost: 2, icon: '💣', hp: 200, dmg: 100, speed: 0.8 }
    ];

    // ---------- СОСТОЯНИЕ ----------
    let deck = [];
    let battleDeck = [];
    let activeHand = [];
    let queueCard = null;
    let elixir = 5.0;
    let maxElixir = 10;
    let elixirRate = 0.35;
    let gameTime = 120;
    let suddenDeath = false;
    let matchActive = false;
    let playerNick = 'Игрок';
    let opponentNick = 'Противник';
    let cups = 0;
    let playerTowers = [];
    let enemyTowers = [];
    let units = [];
    let playerId = null;
    let opponentId = null;
    let ws = null;
    let selectedCardIndex = null;
    let searchingMatch = false;

    // DOM элементы
    const mainMenu = document.getElementById('mainMenu');
    const battleScreen = document.getElementById('battleScreen');
    const resultScreen = document.getElementById('resultScreen');
    const canvas = document.getElementById('battleCanvas');
    const ctx = canvas.getContext('2d');
    let animationFrameId = null;
    let lastTimestamp = 0;

    // ---------- ИНИЦИАЛИЗАЦИЯ ----------
    function loadProfile() {
      playerNick = localStorage.getItem('royaleNick') || 'Игрок';
      cups = parseInt(localStorage.getItem('royaleCups') || '0');
      document.getElementById('nicknameInput').value = playerNick;
      document.getElementById('cupsCount').textContent = cups;
    }
    
    function saveProfile() {
      localStorage.setItem('royaleNick', playerNick);
      localStorage.setItem('royaleCups', cups);
    }

    function initDeck() {
      if (deck.length === 0) {
        deck = [0,1,2,3,4];
      }
      renderDeckGrid();
      updateQueuePreview();
    }

    function renderDeckGrid() {
      const grid = document.getElementById('unitGrid');
      grid.innerHTML = '';
      ALL_UNITS.forEach((unit, idx) => {
        const card = document.createElement('div');
        card.className = 'unit-card' + (deck.includes(idx) ? ' selected' : '');
        card.innerHTML = `<span class="unit-icon">${unit.icon}</span>${unit.name}<br>💰${unit.cost}`;
        card.onclick = () => toggleDeckUnit(idx);
        grid.appendChild(card);
      });
    }

    function toggleDeckUnit(idx) {
      if (deck.includes(idx)) {
        if (deck.length <= 5) return;
        deck = deck.filter(i => i !== idx);
      } else {
        if (deck.length >= 5) {
          deck.shift();
        }
        deck.push(idx);
      }
      renderDeckGrid();
      updateQueuePreview();
    }

    function updateQueuePreview() {
      const preview = document.getElementById('queuePreview');
      if (!deck.length) return;
      const queueUnit = ALL_UNITS[deck[4]];
      preview.innerHTML = `<span>⏳ Очередь: ${queueUnit.icon} ${queueUnit.name} (💰${queueUnit.cost})</span>`;
    }

    // ---------- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ----------
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('tabDeck').style.display = tab==='deck' ? 'flex':'none';
        document.getElementById('tabBattle').style.display = tab==='battle' ? 'flex':'none';
        document.getElementById('tabProfile').style.display = tab==='profile' ? 'flex':'none';
      });
    });

    document.getElementById('saveProfileBtn').onclick = () => {
      playerNick = document.getElementById('nicknameInput').value.trim() || 'Игрок';
      saveProfile();
      document.getElementById('cupsCount').textContent = cups;
    };

    // ---------- WEBSOCKET ----------
    function connectWebSocket() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = window.location.host;
      
      console.log('🔌 Подключение к WebSocket:', `${protocol}//${host}`);
      ws = new WebSocket(`${protocol}//${host}`);
      
      ws.onopen = () => {
        console.log('✅ WebSocket подключен');
        // Генерируем или используем сохраненный ID
        if (!playerId) {
          playerId = localStorage.getItem('royalePlayerId');
          if (!playerId) {
            playerId = 'p_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('royalePlayerId', playerId);
          }
        }
        // Отправляем данные игрока
        ws.send(JSON.stringify({ 
          type: 'setId', 
          id: playerId, 
          nick: playerNick, 
          cups: cups 
        }));
        
        // Если был поиск - продолжаем
        if (searchingMatch) {
          startSearching();
        }
      };
      
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          console.log('📩 Получено сообщение:', msg.type);
          handleMessage(msg);
        } catch (error) {
          console.error('Ошибка обработки сообщения:', error);
        }
      };
      
      ws.onerror = (error) => {
        console.error('❌ Ошибка WebSocket:', error);
        stopSearching();
      };
      
      ws.onclose = () => {
        console.log('🔌 WebSocket отключен');
        stopSearching();
        // Переподключение через 3 секунды
        setTimeout(connectWebSocket, 3000);
      };
    }

    function handleMessage(msg) {
      switch(msg.type) {
        case 'idAssigned':
          console.log('🆔 ID подтвержден:', msg.id);
          playerId = msg.id;
          break;
          
        case 'searching':
          console.log('🔍 Поиск соперника...');
          document.getElementById('searchStatus').style.display = 'block';
          document.getElementById('findMatchBtn').disabled = true;
          break;
          
        case 'matchFound':
          console.log('⚔️ Матч найден!');
          opponentId = msg.opponent;
          opponentNick = msg.opponentNick || 'Противник';
          stopSearching();
          startBattle();
          break;
          
        case 'gameState':
          updateRemoteState(msg);
          break;
          
        case 'emoji':
          displayEmoji(msg.emoji, msg.from);
          break;
          
        case 'battleEnd':
          endBattle(msg.result, msg.winner);
          break;
      }
    }

    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      } else {
        console.warn('⚠️ WebSocket не подключен');
        connectWebSocket();
      }
    }

    // ---------- ПОИСК МАТЧА ----------
    function startSearching() {
      searchingMatch = true;
      document.getElementById('searchStatus').style.display = 'block';
      document.getElementById('findMatchBtn').disabled = true;
      
      if (ws && ws.readyState === WebSocket.OPEN) {
        send({ 
          type: 'findMatch', 
          nick: playerNick, 
          cups: cups 
        });
      }
    }
    
    function stopSearching() {
      searchingMatch = false;
      document.getElementById('searchStatus').style.display = 'none';
      document.getElementById('findMatchBtn').disabled = false;
    }

    document.getElementById('findMatchBtn').onclick = () => {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        connectWebSocket();
        // Даем время на подключение
        setTimeout(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            startSearching();
          }
        }, 500);
      } else {
        startSearching();
      }
    };

    // ---------- БОЙ ----------
    function startBattle() {
      battleDeck = [...deck];
      activeHand = battleDeck.slice(0,4).map(idx => ALL_UNITS[idx]);
      queueCard = ALL_UNITS[battleDeck[4]];
      elixir = 5.0;
      gameTime = 120;
      suddenDeath = false;
      matchActive = true;
      units = [];
      initTowers();
      
      document.getElementById('enemyInfo').textContent = `👤 ${opponentNick}`;
      document.getElementById('timerDisplay').textContent = '2:00';
      document.getElementById('elixirValue').textContent = '5.0';
      document.getElementById('elixirFill').style.width = '50%';
      
      mainMenu.classList.remove('active');
      battleScreen.classList.add('active');
      resultScreen.classList.remove('active');
      
      renderHand();
      
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      lastTimestamp = performance.now();
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function initTowers() {
      playerTowers = [
        { x: 70, y: 320, hp: 800, maxHp: 800, type: 'side', owner: 'player' },
        { x: 200, y: 340, hp: 1200, maxHp: 1200, type: 'main', owner: 'player' },
        { x: 330, y: 320, hp: 800, maxHp: 800, type: 'side', owner: 'player' }
      ];
      enemyTowers = [
        { x: 70, y: 40, hp: 800, maxHp: 800, type: 'side', owner: 'enemy' },
        { x: 200, y: 20, hp: 1200, maxHp: 1200, type: 'main', owner: 'enemy' },
        { x: 330, y: 40, hp: 800, maxHp: 800, type: 'side', owner: 'enemy' }
      ];
    }

    function renderHand() {
      const container = document.getElementById('handCards');
      container.innerHTML = '';
      activeHand.forEach((card, i) => {
        const div = document.createElement('div');
        div.className = 'card-slot' + (selectedCardIndex === i ? ' highlight' : '');
        div.innerHTML = `${card.icon}<br>💰${card.cost}`;
        div.onclick = () => {
          selectedCardIndex = (selectedCardIndex === i) ? null : i;
          renderHand();
        };
        container.appendChild(div);
      });
    }

    function cycleHand(usedIndex) {
      const usedCard = activeHand[usedIndex];
      activeHand.splice(usedIndex, 1);
      activeHand.push(queueCard);
      queueCard = usedCard;
      selectedCardIndex = null;
      renderHand();
    }

    canvas.addEventListener('click', (e) => {
      if (!matchActive || selectedCardIndex === null) return;
      
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;
      
      // Можно размещать только на своей половине (нижняя часть)
      if (mouseY < 200) return;
      
      const card = activeHand[selectedCardIndex];
      if (elixir < card.cost) return;
      
      elixir -= card.cost;
      
      const newUnit = {
        id: Math.random().toString(36),
        type: card.id,
        x: mouseX,
        y: mouseY,
        hp: card.hp,
        maxHp: card.hp,
        dmg: card.dmg,
        speed: card.speed,
        owner: 'player',
        target: null,
        icon: card.icon
      };
      
      units.push(newUnit);
      cycleHand(selectedCardIndex);
      
      // Отправляем на сервер
      send({ 
        type: 'placeUnit', 
        unit: newUnit, 
        x: mouseX, 
        y: mouseY 
      });
    });

    function updateRemoteState(msg) {
      if (!matchActive) return;
      
      // Обновляем вражеские юниты
      if (msg.units) {
        // Оставляем своих юнитов, заменяем вражеских
        units = units.filter(u => u.owner === 'player');
        const enemyUnits = msg.units.filter(u => u.owner === 'enemy');
        units.push(...enemyUnits);
      }
      
      // Обновляем вражеские башни
      if (msg.towers && msg.towers.enemy) {
        enemyTowers = msg.towers.enemy;
      }
    }

    function displayEmoji(emoji, from) {
      const tower = from === playerId ? playerTowers[1] : enemyTowers[1];
      if (tower) tower.emoji = { symbol: emoji, timer: 2.0 };
    }

    document.getElementById('emojiToggle').onclick = () => {
      const panel = document.getElementById('emojiPanel');
      panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
    };
    
    document.querySelectorAll('.emoji-item').forEach(el => {
      el.onclick = () => {
        const emoji = el.textContent;
        displayEmoji(emoji, playerId);
        send({ type: 'emoji', emoji });
        document.getElementById('emojiPanel').style.display = 'none';
      };
    });

    function gameLoop(ts) {
      if (!matchActive) return;
      
      const dt = Math.min((ts - lastTimestamp) / 1000, 0.1);
      lastTimestamp = ts;
      
      // Таймер и эликсир
      gameTime -= dt;
      
      if (gameTime <= 0) {
        if (!suddenDeath && checkMainTowersIntact()) {
          suddenDeath = true;
          gameTime = 60;
          elixirRate = 0.7;
        } else {
          endBattleByTimeout();
          return;
        }
      }
      
      const rate = suddenDeath ? 0.7 : 0.35;
      elixir = Math.min(maxElixir, elixir + rate * dt);
      
      updateUnits(dt);
      checkTowerDestruction();
      drawCanvas();
      updateHUD();
      
      if (matchActive) {
        // Отправляем состояние на сервер каждые 100мс
        send({ 
          type: 'stateUpdate', 
          units: units.filter(u => u.owner === 'player'), 
          towers: { player: playerTowers } 
        });
        animationFrameId = requestAnimationFrame(gameLoop);
      }
    }

    function updateUnits(dt) {
      units.forEach(u => {
        if (u.hp <= 0) return;
        
        const targetTowers = u.owner === 'player' ? enemyTowers : playerTowers;
        let closest = null;
        let minDist = Infinity;
        
        targetTowers.forEach(t => {
          if (t.hp <= 0) return;
          const dx = t.x - u.x, dy = t.y - u.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < minDist) { 
            minDist = dist; 
            closest = t; 
          }
        });
        
        if (closest) {
          const dx = closest.x - u.x;
          const dy = closest.y - u.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          
          if (dist > 25) {
            u.x += (dx/dist) * u.speed * 60 * dt;
            u.y += (dy/dist) * u.speed * 60 * dt;
          } else {
            closest.hp -= u.dmg * dt;
          }
        }
      });
      
      // Удаляем мертвых юнитов
      units = units.filter(u => u.hp > 0);
      
      // Удаляем уничтоженные башни из целей
      playerTowers = playerTowers.filter(t => t.hp > 0);
      enemyTowers = enemyTowers.filter(t => t.hp > 0);
    }

    function checkTowerDestruction() {
      const playerMain = playerTowers.find(t => t.type === 'main');
      const enemyMain = enemyTowers.find(t => t.type === 'main');
      
      if (enemyMain && enemyMain.hp <= 0) {
        endBattle('win');
      }
      if (playerMain && playerMain.hp <= 0) {
        endBattle('lose');
      }
    }

    function checkMainTowersIntact() {
      const playerMain = playerTowers.find(t => t.type === 'main');
      const enemyMain = enemyTowers.find(t => t.type === 'main');
      return playerMain && enemyMain && playerMain.hp > 0 && enemyMain.hp > 0;
    }

    function endBattleByTimeout() {
      const playerMain = playerTowers.find(t => t.type === 'main');
      const enemyMain = enemyTowers.find(t => t.type === 'main');
      
      if (!playerMain || !enemyMain) {
        endBattle('draw');
        return;
      }
      
      if (playerMain.hp > enemyMain.hp) endBattle('win');
      else if (enemyMain.hp > playerMain.hp) endBattle('lose');
      else endBattle('draw');
    }

    function endBattle(result, winnerId) {
      if (!matchActive) return;
      matchActive = false;
      
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      
      let change = 0;
      if (result === 'win') { 
        cups += 30; 
        change = 30; 
      } else if (result === 'lose') { 
        cups = Math.max(0, cups - 25); 
        change = -25; 
      }
      
      saveProfile();
      
      document.getElementById('resultTitle').textContent = 
        result === 'win' ? '🏆 Победа!' : 
        (result === 'lose' ? '💔 Поражение' : '🤝 Ничья');
      document.getElementById('resultCups').textContent = 
        `${playerNick} 🏆${cups} (${change > 0 ? '+' : ''}${change}) vs ${opponentNick}`;
      
      battleScreen.classList.remove('active');
      resultScreen.classList.add('active');
      
      send({ type: 'battleEnd', result });
    }

    function drawCanvas() {
      ctx.clearRect(0, 0, 400, 380);
      
      // Трава
      ctx.fillStyle = '#3a5a3a';
      ctx.fillRect(0, 0, 400, 380);
      
      // Река
      ctx.fillStyle = '#2f6f8f';
      ctx.fillRect(0, 180, 400, 20);
      
      // Башни
      [...enemyTowers, ...playerTowers].forEach(t => {
        if (t.hp <= 0) return;
        
        ctx.fillStyle = t.owner === 'player' ? '#4a7db0' : '#c94b4b';
        ctx.beginPath();
        ctx.arc(t.x, t.y, 16, 0, Math.PI * 2);
        ctx.fill();
        
        // HP bar
        ctx.fillStyle = '#333';
        ctx.fillRect(t.x - 15, t.y - 25, 30, 4);
        ctx.fillStyle = '#2ecc71';
        const hpPercent = t.hp / t.maxHp;
        ctx.fillRect(t.x - 15, t.y - 25, 30 * hpPercent, 4);
        
        ctx.fillStyle = 'white';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText(Math.ceil(t.hp), t.x - 12, t.y - 30);
        
        // Эмодзи над башней
        if (t.emoji) {
          ctx.font = '24px sans-serif';
          ctx.fillText(t.emoji.symbol, t.x - 12, t.y - 40);
          t.emoji.timer -= 0.016;
          if (t.emoji.timer <= 0) t.emoji = null;
        }
      });
      
      // Юниты
      units.forEach(u => {
        if (u.hp <= 0) return;
        
        ctx.fillStyle = u.owner === 'player' ? '#7cb0e8' : '#e87c7c';
        ctx.beginPath();
        ctx.arc(u.x, u.y, 10, 0, 2 * Math.PI);
        ctx.fill();
        
        // HP bar
        ctx.fillStyle = '#333';
        ctx.fillRect(u.x - 10, u.y - 18, 20, 3);
        ctx.fillStyle = '#2ecc71';
        const hpPercent = u.hp / u.maxHp;
        ctx.fillRect(u.x - 10, u.y - 18, 20 * hpPercent, 3);
        
        ctx.fillStyle = 'white';
        ctx.font = '16px sans-serif';
        ctx.fillText(u.icon || '👤', u.x - 8, u.y + 6);
      });
    }

    function updateHUD() {
      const minutes = Math.floor(gameTime / 60);
      const seconds = Math.floor(gameTime % 60);
      document.getElementById('timerDisplay').textContent = 
        `${minutes}:${String(seconds).padStart(2, '0')}`;
      document.getElementById('elixirValue').textContent = elixir.toFixed(1);
      document.getElementById('elixirFill').style.width = (elixir / maxElixir * 100) + '%';
    }

    document.getElementById('exitResultBtn').onclick = () => {
      resultScreen.classList.remove('active');
      mainMenu.classList.add('active');
      document.getElementById('cupsCount').textContent = cups;
      stopSearching();
    };

    // Инициализация
    loadProfile();
    initDeck();
    connectWebSocket();
  })();
</script>
