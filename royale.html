<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bum Royale Official</title>
    <style>
        :root { --blue: #3498db; --red: #e74c3c; --dark: #121212; --gold: #f1c40f; --grass: #2ecc71; --river: #2980b9; }
        body { margin: 0; padding: 0; font-family: 'Arial', sans-serif; background: var(--dark); color: white; overflow: hidden; touch-action: none; }
        
        /* Вкладки и Меню */
        #ui-layer { position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 100; background: var(--dark); }
        .screen { display: none; flex: 1; padding: 20px; overflow-y: auto; text-align: center; }
        .screen.active { display: flex; flex-direction: column; align-items: center; }
        
        .tabs { display: flex; background: #000; height: 70px; border-top: 2px solid #333; }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #666; font-weight: bold; }
        .tab.active { color: var(--blue); border-top: 4px solid var(--blue); background: #1a1a1a; }

        /* Сетка карт во вкладке "Карты" */
        .deck-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin-top: 20px; }
        .deck-card { background: #fff; color: #000; border-radius: 8px; padding: 10px 5px; position: relative; border: 4px solid #444; font-size: 12px; }
        .deck-card.in-deck { border-color: var(--grass); background: #e0ffe0; }
        .cost-tag { position: absolute; top: -5px; left: -5px; background: #9b59b6; color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 11px; }

        /* Боевой экран */
        #game-container { position: relative; width: 100vw; height: 100vh; display: none; background: var(--grass); }
        canvas { display: block; }

        /* Нижний интерфейс боя */
        .battle-hud { position: absolute; bottom: 0; width: 100%; height: 170px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 10px; }
        .elixir-box { width: 90%; margin-bottom: 8px; pointer-events: auto; }
        .elixir-bar { width: 100%; height: 20px; background: #333; border-radius: 10px; border: 2px solid #555; position: relative; overflow: hidden; }
        .elixir-fill { height: 100%; background: linear-gradient(90deg, #8e44ad, #d060d0); width: 0%; transition: width 0.3s; }
        .elixir-txt { position: absolute; width: 100%; text-align: center; top: 0; line-height: 20px; font-weight: bold; text-shadow: 1px 1px #000; }

        .cards-hand { display: flex; gap: 6px; pointer-events: auto; align-items: flex-end; }
        .card { width: 70px; height: 95px; background: #fff; border-radius: 6px; border: 3px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 5px; box-sizing: border-box; transition: 0.1s; color: black; font-weight: bold; font-size: 11px; }
        .card.selected { transform: translateY(-15px); border-color: var(--gold); }

        .emoji-btn { position: absolute; bottom: 180px; right: 20px; width: 50px; height: 50px; background: rgba(0,0,0,0.7); border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: auto; font-size: 24px; }
    </style>
</head>
<body>

<div id="ui-layer">
    <!-- Вкладка 1: Карты -->
    <div id="deck-screen" class="screen">
        <h2 style="color:var(--gold)">МОЯ КОЛОДА (<span id="deck-count">0</span>/5)</h2>
        <div class="deck-grid" id="all-units-list"></div>
    </div>

    <!-- Вкладка 2: Бой -->
    <div id="main-screen" class="screen active">
        <div style="font-size: 50px; margin-top: 50px;">🏆 <span id="trophies-ui">0</span></div>
        <h3 id="name-ui">Загрузка...</h3>
        <button onclick="startSearch()" style="background: var(--red); color: white; padding: 25px 80px; font-size: 28px; border: none; border-radius: 50px; font-weight: bold; box-shadow: 0 8px #900; margin-top: 20px;">В БОЙ</button>
        <p id="status-text" style="color: var(--blue); margin-top: 20px;"></p>
    </div>

    <!-- Вкладка 3: Профиль -->
    <div id="profile-screen" class="screen">
        <h2>НАСТРОЙКИ</h2>
        <p>Ваше имя:</p>
        <input type="text" id="name-input" style="padding: 12px; border-radius: 8px; width: 200px; border: none;">
        <br>
        <button onclick="saveName()" style="margin-top: 15px; padding: 10px 30px; background: var(--blue); color: white; border: none; border-radius: 5px;">Сохранить</button>
    </div>

    <div class="tabs">
        <div class="tab" onclick="switchTab('deck-screen')">КАРТЫ</div>
        <div id="mid-tab" class="tab active" onclick="switchTab('main-screen')">БОЙ</div>
        <div class="tab" onclick="switchTab('profile-screen')">ИГРОК</div>
    </div>
</div>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="emoji-btn" onclick="sendEmoji('🤣')">🤣</div>

    <div class="battle-hud">
        <div class="elixir-box">
            <div class="elixir-bar"><div id="elixir-f" class="elixir-fill"></div><div class="elixir-txt">💧 <span id="elixir-n">0</span></div></div>
        </div>
        <div class="cards-hand" id="hand-display"></div>
    </div>
</div>

<script>
// --- ДАННЫЕ ЮНИТОВ (10 штук) ---
const ALL_UNITS = [
    {id:0, name:"Рыцарь", cost:3}, {id:1, name:"Лучник", cost:2},
    {id:2, name:"Гигант", cost:5}, {id:3, name:"Скелет", cost:1},
    {id:4, name:"Мушкетер", cost:4}, {id:5, name:"Миньон", cost:3},
    {id:6, name:"Всадник", cost:4}, {id:7, name:"Пекка", cost:7},
    {id:8, name:"Маг", cost:5}, {id:9, name:"Дракон", cost:4}
];

let player = {
    name: localStorage.getItem('b_name') || "Игрок",
    trophies: parseInt(localStorage.getItem('b_trophies')) || 0,
    deck: JSON.parse(localStorage.getItem('b_deck')) || [0, 1, 2, 3, 4]
};

let game = { active: false, elixir: 0, hand: [], selected: -1, role: 'p1', sync: null };
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let ws;

function init() {
    document.getElementById('name-ui').innerText = player.name;
    document.getElementById('name-input').value = player.name;
    document.getElementById('trophies-ui').innerText = player.trophies;
    renderDeckManager();
    window.addEventListener('resize', resize);
    resize();
}

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

function switchTab(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.currentTarget.classList.add('active');
}

function renderDeckManager() {
    const container = document.getElementById('all-units-list');
    container.innerHTML = '';
    ALL_UNITS.forEach(u => {
        const inDeck = player.deck.includes(u.id);
        const card = document.createElement('div');
        card.className = `deck-card ${inDeck ? 'in-deck' : ''}`;
        card.innerHTML = `<div class="cost-tag">${u.cost}</div>${u.name}`;
        card.onclick = () => {
            if(inDeck) {
                if(player.deck.length > 1) player.deck = player.deck.filter(id => id !== u.id);
            } else if(player.deck.length < 5) {
                player.deck.push(u.id);
            }
            localStorage.setItem('b_deck', JSON.stringify(player.deck));
            document.getElementById('deck-count').innerText = player.deck.length;
            renderDeckManager();
        };
        container.appendChild(card);
    });
    document.getElementById('deck-count').innerText = player.deck.length;
}

function saveName() {
    player.name = document.getElementById('name-input').value;
    localStorage.setItem('b_name', player.name);
    alert("Имя сохранено!");
    location.reload();
}

function startSearch() {
    if(player.deck.length < 5) return alert("Собери колоду из 5 карт!");
    document.getElementById('status-text').innerText = "Поиск врага...";
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${location.host}`);

    ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if(d.type === 'match_start') {
            game.role = d.role;
            game.hand = player.deck.slice(0, 4);
            document.getElementById('ui-layer').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            game.active = true;
            renderBattleHand();
            battleLoop();
        }
        if(d.type === 'sync') game.sync = d;
    };
    ws.onopen = () => ws.send(JSON.stringify({type:'join', name:player.name, deck:player.deck}));
}

function renderBattleHand() {
    const cont = document.getElementById('hand-display');
    cont.innerHTML = '';
    game.hand.forEach((id, i) => {
        const u = ALL_UNITS.find(x => x.id === id);
        const div = document.createElement('div');
        div.className = `card ${game.selected === i ? 'selected' : ''}`;
        div.innerHTML = `💧${u.cost}<br>${u.name}`;
        div.onclick = (e) => { e.stopPropagation(); game.selected = i; renderBattleHand(); };
        cont.appendChild(div);
    });
}

canvas.addEventListener('mousedown', (e) => {
    if(!game.active || game.selected === -1) return;
    const x = e.clientX / canvas.width, y = e.clientY / canvas.height;
    const u = ALL_UNITS.find(x => x.id === game.hand[game.selected]);

    if(game.elixir >= u.cost) {
        ws.send(JSON.stringify({ type:'place_unit', unitId:u.id, x, y }));
        game.elixir -= u.cost;
        // Простая ротация
        const current = game.hand[game.selected];
        const nextId = player.deck.find(id => !game.hand.includes(id)) || player.deck[0];
        game.hand[game.selected] = nextId;
        game.selected = -1;
        renderBattleHand();
    }
});

function drawCastle(t) {
    const x = t.x * canvas.width, y = t.y * canvas.height;
    const size = t.id.includes('main') ? 35 : 25;
    ctx.fillStyle = t.owner === game.role ? '#3498db' : '#e74c3c';
    ctx.fillRect(x - size, y - size, size*2, size*2); // Тело
    ctx.fillStyle = '#222'; // Зубцы
    ctx.fillRect(x-size, y-size-5, 10, 5); 
    ctx.fillRect(x+size-10, y-size-5, 10, 5);
}

function battleLoop() {
    if(!game.active) return;
    ctx.fillStyle = '#2ecc71'; ctx.fillRect(0,0,canvas.width,canvas.height); // Трава

    const W = canvas.width, H = canvas.height;
    ctx.fillStyle = '#3498db'; ctx.fillRect(0, H*0.45, W, H*0.1); // Река

    // Мосты
    ctx.fillStyle = '#795548';
    ctx.fillRect(W*0.15, H*0.44, W*0.2, H*0.12); // Левый
    ctx.fillRect(W*0.65, H*0.44, W*0.2, H*0.12); // Правый

    if(game.sync) {
        game.sync.towers.forEach(t => drawCastle(t));
        game.sync.units.forEach(u => {
            ctx.fillStyle = u.owner === game.role ? 'blue' : 'red';
            ctx.beginPath(); ctx.arc(u.x*W, u.y*H, 12, 0, Math.PI*2); ctx.fill();
        });
        if(game.elixir < 10) game.elixir += 0.015;
        document.getElementById('elixir-n').innerText = Math.floor(game.elixir);
        document.getElementById('elixir-f').style.width = (game.elixir*10)+'%';
    }
    requestAnimationFrame(battleLoop);
}

init();
</script>
</body>
</html>
