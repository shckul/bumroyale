<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bum Royale: Hardcore Edition</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --p: #9b59b6; --g: #f1c40f; --r: #e74c3c; --b: #3498db; --dark: #121212; }
        body { margin: 0; padding: 0; background: var(--dark); color: white; font-family: 'Verdana', sans-serif; overflow: hidden; touch-action: none; }
        
        /* ГЛАВНЫЙ КОНТЕЙНЕР */
        #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        .screen { display: none; flex: 1; position: relative; width: 100%; height: 100%; overflow: hidden; }
        .screen.active { display: flex; flex-direction: column; }

        /* НАВИГАЦИЯ */
        #nav { height: 75px; background: #1a1a1a; display: flex; border-top: 2px solid #333; z-index: 100; }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; opacity: 0.5; }
        .nav-btn.active { opacity: 1; color: var(--g); background: #252525; }
        .nav-btn span { font-size: 24px; margin-bottom: 4px; }

        /* ЭКРАН КОЛОДЫ */
        #deck-container { padding: 15px; overflow-y: auto; }
        .deck-title { text-align: center; color: var(--g); text-shadow: 1px 1px #000; }
        .current-deck { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: #222; padding: 10px; border-radius: 12px; border: 2px solid var(--g); margin-bottom: 20px; }
        .all-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .card-item { background: #fff; color: #000; border-radius: 8px; padding: 8px; text-align: center; position: relative; border: 3px solid transparent; }
        .card-item.selected { border-color: var(--b); transform: scale(1.05); }
        .card-item .cost { position: absolute; top: -5px; left: -5px; background: var(--p); color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; line-height: 20px; }

        /* ЭКРАН БОЯ (ЛОББИ) */
        #lobby { align-items: center; justify-content: center; background: radial-gradient(circle, #2c3e50, #000); }
        .play-btn { width: 180px; height: 180px; border-radius: 50%; border: 10px solid #27ae60; background: #2ecc71; color: white; font-size: 28px; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .play-btn:active { transform: scale(0.95); }

        /* ПОЛЕ БОЯ */
        #battle-ground { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 75px); display: none; }
        #gameCanvas { display: block; background: #4a703b; }
        
        /* ИНТЕРФЕЙС БОЯ */
        #battle-ui { position: absolute; bottom: 0; width: 100%; pointer-events: none; }
        .elixir-wrapper { width: 90%; height: 14px; background: #000; margin: 0 auto 10px; border-radius: 7px; overflow: hidden; border: 2px solid #333; }
        #elixir-fill { height: 100%; width: 50%; background: linear-gradient(90deg, #e0aaff, var(--p)); transition: width 0.3s; }
        .battle-hand { height: 100px; display: flex; justify-content: center; gap: 6px; padding-bottom: 10px; pointer-events: auto; }
        .b-card { width: 65px; height: 90px; background: white; border-radius: 8px; border: 3px solid #777; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #333; font-weight: bold; font-size: 11px; }
        .b-card.active { border-color: var(--g); transform: translateY(-10px); }

        /* ПИНЫ */
        #pin-system { position: absolute; left: 10px; bottom: 130px; pointer-events: auto; }
        #pin-pop { display: none; background: rgba(0,0,0,0.8); border-radius: 15px; padding: 8px; border: 2px solid var(--g); flex-direction: column; gap: 8px; margin-bottom: 5px; }
        .pin-opt { font-size: 28px; transition: 0.2s; }
        .pin-opt.cd { filter: grayscale(1); opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body>

<div id="app">
    <!-- КОЛОДА -->
    <div id="screen-deck" class="screen">
        <div id="deck-container">
            <h2 class="deck-title">БОЕВАЯ КОЛОДА</h2>
            <div class="current-deck" id="active-deck"></div>
            <h3 style="text-align:center">ВСЕ КАРТЫ</h3>
            <div class="all-cards" id="collection"></div>
        </div>
    </div>

    <!-- БОЙ (ЛОББИ) -->
    <div id="screen-battle" class="screen active">
        <div id="lobby">
            <div style="margin-bottom: 30px; text-align: center;">
                <h1 style="color: var(--g); margin: 0;">BUM ROYALE</h1>
                <p>🏆 Трофеи: <span id="trophy-count">0</span></p>
            </div>
            <button class="play-btn" onclick="startMatch()">В БОЙ</button>
        </div>
        
        <div id="battle-ground">
            <div id="pin-system">
                <div id="pin-pop">
                    <div class="pin-opt" onclick="sendEmoji('😂')">😂</div>
                    <div class="pin-opt" onclick="sendEmoji('😠')">😠</div>
                    <div class="pin-opt" onclick="sendEmoji('👍')">👍</div>
                </div>
                <button onclick="togglePinMenu()" style="width:45px; height:45px; border-radius:50%; background:rgba(0,0,0,0.7); color:white; border:2px solid #fff;">💬</button>
            </div>

            <canvas id="gameCanvas"></canvas>

            <div id="battle-ui">
                <div class="elixir-wrapper"><div id="elixir-fill"></div></div>
                <div class="battle-hand" id="battle-hand-el"></div>
            </div>
        </div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="screen-profile" class="screen">
        <div style="padding: 20px; text-align: center;">
            <div style="width: 100px; height: 100px; background: var(--b); border-radius: 50%; margin: 20px auto; display: flex; align-items: center; justify-content: center; font-size: 40px;">👤</div>
            <h2>Player_Mobile</h2>
            <div style="background: #222; padding: 15px; border-radius: 10px; text-align: left;">
                <p>🏆 Рекорд кубков: <span id="max-trophies">0</span></p>
                <p>⚔️ Всего боев: 142</p>
                <p>📱 Устройство: Smartphone</p>
            </div>
        </div>
    </div>

    <!-- ТАБ-БАР -->
    <div id="nav">
        <div class="nav-btn" onclick="setTab('deck', this)"><span>🎴</span>КОЛОДА</div>
        <div class="nav-btn active" onclick="setTab('battle', this)"><span>⚔️</span>БОЙ</div>
        <div class="nav-btn" onclick="setTab('profile', this)"><span>👤</span>ПРОФИЛЬ</div>
    </div>
</div>

<script>
/**
 * КОНСТАНТЫ И ДАННЫЕ ЮНИТОВ
 */
const socket = io("https://bumroyale.onrender.com");
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const CARD_DATA = [
    { id: 0, name: "Рыцарь", hp: 1400, dmg: 90, range: 45, speed: 1.2, cost: 3, icon: "⚔️", color: "#3498db" },
    { id: 1, name: "Лучник", hp: 550, dmg: 65, range: 220, speed: 1.0, cost: 2, icon: "🏹", color: "#f1c40f" },
    { id: 2, name: "Гигант", hp: 3800, dmg: 130, range: 50, speed: 0.6, cost: 5, icon: "👹", color: "#e67e22" },
    { id: 3, name: "Маг", hp: 680, dmg: 190, range: 180, speed: 0.9, cost: 4, icon: "🔥", color: "#9b59b6" },
    { id: 4, name: "Скелеты", hp: 150, dmg: 40, range: 35, speed: 1.5, cost: 1, icon: "💀", color: "#eee" },
    { id: 5, name: "Мушкетер", hp: 700, dmg: 110, range: 240, speed: 1.0, cost: 4, icon: "🔫", color: "#d35400" },
    { id: 6, name: "Пекка", hp: 3200, dmg: 450, range: 55, speed: 0.7, cost: 7, icon: "🤖", color: "#2c3e50" }
];

let player = {
    trophies: parseInt(localStorage.getItem('br_trophies')) || 0,
    deck: JSON.parse(localStorage.getItem('br_deck')) || [0, 1, 2, 3],
    selectedForSwap: null
};

/**
 * СИСТЕМА ВКЛАДОК И СМЕНЫ КОЛОДЫ
 */
function setTab(name, el) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`screen-${name}`).classList.add('active');
    el.classList.add('active');
    if(name === 'deck') renderDeckUI();
}

function renderDeckUI() {
    const activeEl = document.getElementById('active-deck');
    const collectEl = document.getElementById('collection');
    
    activeEl.innerHTML = player.deck.map((id, index) => {
        const c = CARD_DATA[id];
        return `<div class="card-item" onclick="selectFromDeck(${index})">
            <div class="cost">${c.cost}</div>
            <div style="font-size:24px">${c.icon}</div>
            <div style="font-size:9px">${c.name}</div>
        </div>`;
    }).join('');

    collectEl.innerHTML = CARD_DATA.map(c => {
        const inDeck = player.deck.includes(c.id);
        return `<div class="card-item ${inDeck ? 'cd' : ''}" onclick="swapCard(${c.id})">
            <div class="cost">${c.cost}</div>
            <div style="font-size:24px">${c.icon}</div>
            <div style="font-size:9px">${c.name}</div>
        </div>`;
    }).join('');
}

function selectFromDeck(index) {
    player.selectedForSwap = index;
    alert("Теперь выбери карту из коллекции для замены!");
}

function swapCard(newId) {
    if(player.selectedForSwap === null) return;
    if(player.deck.includes(newId)) return;
    
    player.deck[player.selectedForSwap] = newId;
    player.selectedForSwap = null;
    localStorage.setItem('br_deck', JSON.stringify(player.deck));
    renderDeckUI();
}

/**
 * ИГРОВОЙ ДВИЖОК
 */
let world = {
    isStarted: false,
    entities: [],
    effects: [],
    elixir: 5,
    hand: [],
    activeIdx: -1,
    room: null,
    lastPin: 0
};

function startMatch() {
    document.querySelector('.play-btn').innerText = "ПОИСК...";
    socket.emit('find_match', { trophies: player.trophies });
}

socket.on('match_found', (data) => {
    world.room = data.room;
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('battle-ground').style.display = 'block';
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - 75;
    
    world.isStarted = true;
    world.entities = [];
    world.hand = player.deck.slice(0, 4);
    
    initMap();
    renderBattleHand();
    requestAnimationFrame(gameLoop);
});

function initMap() {
    const w = canvas.width, h = canvas.height;
    // Короли
    addEnt({ x: w/2, y: h-70, hp: 4200, isMe: true, isK: true, range: 250, dmg: 65 });
    addEnt({ x: w/2, y: 70, hp: 4200, isMe: false, isK: true, range: 250, dmg: 65 });
    // Принцессы
    addEnt({ x: w*0.25, y: h-180, hp: 2600, isMe: true, range: 220, dmg: 55 });
    addEnt({ x: w*0.75, y: h-180, hp: 2600, isMe: true, range: 220, dmg: 55 });
    addEnt({ x: w*0.25, y: 180, hp: 2600, isMe: false, range: 220, dmg: 55 });
    addEnt({ x: w*0.75, y: 180, hp: 2600, isMe: false, range: 220, dmg: 55 });
}

function addEnt(cfg) {
    world.entities.push({
        ...cfg, maxHp: cfg.hp, isTower: true, reload: 0
    });
}

/**
 * ЛОГИКА БОЯ (NAV + AI)
 */
function gameLoop() {
    if(!world.isStarted) return;
    const dt = 1/60;

    // Ресурсы
    if(world.elixir < 10) world.elixir += 0.35 * dt;
    document.getElementById('elixir-fill').style.width = (world.elixir * 10) + "%";

    // Очистка
    ctx.fillStyle = "#4a703b"; ctx.fillRect(0,0, canvas.width, canvas.height);
    
    // Река и мосты
    ctx.fillStyle = "#2980b9"; ctx.fillRect(0, canvas.height/2 - 25, canvas.width, 50);
    ctx.fillStyle = "#7f8c8d";
    const bL = canvas.width * 0.25, bR = canvas.width * 0.75;
    ctx.fillRect(bL - 35, canvas.height/2 - 35, 70, 70);
    ctx.fillRect(bR - 35, canvas.height/2 - 35, 70, 70);

    world.entities.forEach(ent => {
        // AI: Поиск цели
        let target = null;
        let minDist = 9999;
        world.entities.forEach(other => {
            if(other.isMe !== ent.isMe && other.hp > 0) {
                const d = Math.hypot(ent.x - other.x, ent.y - other.y);
                if(d < minDist) { minDist = d; target = other; }
            }
        });

        if(target) {
            const d = Math.hypot(ent.x - target.x, ent.y - target.y);
            if(d <= ent.range) {
                if(ent.reload <= 0) {
                    target.hp -= ent.dmg; ent.reload = 1.1;
                }
            } else if(!ent.isTower) {
                // Навигация по мостам
                let tx = target.x, ty = target.y;
                const riverY = canvas.height / 2;
                if((ent.isMe && ent.y > riverY + 10 && ty < riverY) || (!ent.isMe && ent.y < riverY - 10 && ty > riverY)) {
                    tx = (ent.x < canvas.width/2) ? bL : bR;
                    ty = riverY;
                }
                const angle = Math.atan2(ty - ent.y, tx - ent.x);
                ent.x += Math.cos(angle) * ent.speed;
                ent.y += Math.sin(angle) * ent.speed;
            }
        }
        if(ent.reload > 0) ent.reload -= dt;

        // Отрисовка
        ctx.fillStyle = ent.isMe ? "#3498db" : "#e74c3c";
        if(ent.isTower) {
            ctx.fillRect(ent.x - 25, ent.y - 25, 50, 50);
        } else {
            ctx.beginPath(); ctx.arc(ent.x, ent.y, 16, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.fillText(ent.icon, ent.x - 8, ent.y + 5);
        }
        // HP
        ctx.fillStyle = "#000"; ctx.fillRect(ent.x-20, ent.y-35, 40, 5);
        ctx.fillStyle = "#2ecc71"; ctx.fillRect(ent.x-20, ent.y-35, 40 * (ent.hp/ent.maxHp), 5);
    });

    // Эффекты пинов
    world.effects.forEach((ef, idx) => {
        ctx.font = "40px Arial";
        ctx.fillText(ef.txt, ef.x - 20, ef.y - 60 + Math.sin(Date.now()/200)*10);
        ef.life -= dt;
        if(ef.life <= 0) world.effects.splice(idx, 1);
    });

    world.entities = world.entities.filter(e => e.hp > 0);
    requestAnimationFrame(gameLoop);
}

/**
 * УПРАВЛЕНИЕ И ПИНЫ
 */
function togglePinMenu() {
    const p = document.getElementById('pin-pop');
    p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
}

function sendEmoji(txt) {
    if(Date.now() - world.lastPin < 3000) return;
    world.lastPin = Date.now();
    togglePinMenu();
    
    const king = world.entities.find(e => e.isMe && e.isK);
    if(king) world.effects.push({ txt, x: king.x, y: king.y, life: 2 });
    
    socket.emit('send_pin', { room: world.room, emoji: txt });
}

function renderBattleHand() {
    const el = document.getElementById('battle-hand-el');
    el.innerHTML = world.hand.map((id, i) => {
        const c = CARD_DATA[id];
        return `<div class="b-card ${world.activeIdx === i ? 'active' : ''}" onclick="world.activeIdx = ${i}; renderBattleHand()">
            <div style="font-size:20px">${c.icon}</div>
            <div>${c.cost}💧</div>
        </div>`;
    }).join('');
}

canvas.addEventListener('touchstart', (e) => {
    if(world.activeIdx === -1) return;
    const card = CARD_DATA[world.hand[world.activeIdx]];
    if(world.elixir < card.cost) return;

    const t = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = t.clientX - rect.left, y = t.clientY - rect.top;

    if(y < canvas.height/2 + 50) return;

    world.elixir -= card.cost;
    world.entities.push({ ...card, x, y, isMe: true, maxHp: card.hp, reload: 0 });
    socket.emit('spawn', { room: world.room, id: card.id, x: x/canvas.width, y: y/canvas.height });

    // Ротация карт
    world.hand[world.activeIdx] = player.deck[Math.floor(Math.random()*player.deck.length)];
    world.activeIdx = -1;
    renderBattleHand();
});

socket.on('enemy_spawn', (d) => {
    const card = CARD_DATA[d.id];
    world.entities.push({ ...card, x: (1-d.x)*canvas.width, y: (1-d.y)*canvas.height, isMe: false, maxHp: card.hp, reload: 0 });
});

socket.on('receive_pin', (d) => {
    const king = world.entities.find(e => !e.isMe && e.isK);
    if(king) world.effects.push({ txt: d.emoji, x: king.x, y: king.y, life: 2 });
});
</script>
</body>
</html>
