<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bum Royale Mobile</title>
    <style>
        :root { --blue: #3498db; --red: #e74c3c; --dark: #2c3e50; --gold: #f1c40f; }
        body { margin: 0; font-family: sans-serif; background: var(--dark); color: white; overflow: hidden; touch-action: manipulation; }
        
        /* Меню и вкладки */
        #ui-layer { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; z-index: 100; }
        .screen { display: none; flex: 1; padding: 15px; text-align: center; overflow-y: auto; }
        .screen.active { display: block; }
        
        .tabs { display: flex; background: #1a252f; height: 70px; border-top: 2px solid #34495e; }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; opacity: 0.6; }
        .tab.active { opacity: 1; border-top: 4px solid var(--blue); background: #2c3e50; }

        /* Колода */
        .deck-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .card { background: #ecf0f1; color: #2c3e50; padding: 10px; border-radius: 8px; position: relative; border: 3px solid transparent; font-size: 12px; font-weight: bold; }
        .card.selected { border-color: #27ae60; background: #d5f5e3; }
        .card .cost { position: absolute; top: -5px; left: -5px; background: #9b59b6; color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 11px; }

        /* Бой HUD */
        #game-container { position: relative; width: 100vw; height: 100vh; background: #27ae60; display: none; }
        canvas { display: block; background: #2ecc71; margin: 0 auto; }
        
        .hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .opp-info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 15px; font-size: 14px; }
        .timer { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: bold; text-shadow: 2px 2px #000; }
        
        /* Эликсир и Карты в бою */
        .battle-bottom { position: absolute; bottom: 0; width: 100%; height: 120px; background: rgba(0,0,0,0.3); pointer-events: auto; }
        .elixir-container { width: 90%; height: 12px; background: #34495e; margin: 5px auto; border-radius: 6px; overflow: hidden; position: relative; }
        .elixir-fill { height: 100%; background: #9b59b6; width: 0%; transition: width 0.3s; }
        .elixir-num { position: absolute; width: 100%; text-align: center; top: -2px; font-size: 12px; font-weight: bold; color: #f0f; }

        .hand { display: flex; justify-content: center; gap: 8px; margin-top: 5px; }
        .hand-card { width: 60px; height: 80px; background: white; color: black; border-radius: 5px; position: relative; border: 2px solid #333; font-size: 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .hand-card.active { border-color: var(--gold); transform: translateY(-10px); }
        .next-card { width: 40px; height: 55px; opacity: 0.8; margin-left: 10px; background: #bdc3c7; }

        /* Эмодзи */
        .emoji-btn { position: absolute; bottom: 130px; right: 15px; font-size: 30px; pointer-events: auto; }
        .emoji-panel { position: absolute; bottom: 170px; right: 15px; background: rgba(0,0,0,0.8); display: none; padding: 10px; border-radius: 10px; pointer-events: auto; }
        .emoji-panel span { font-size: 25px; margin: 0 5px; cursor: pointer; }

        #result-screen { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="deck" class="screen">
        <h3>КОЛОДА (выбери 5)</h3>
        <div id="deck-list" class="deck-grid"></div>
    </div>

    <div id="main" class="screen active">
        <h1 style="color: var(--gold); margin-top: 50px;">🏆 <span id="user-trophies">0</span></h1>
        <p id="user-name-display">Игрок</p>
        <button id="battle-btn" onclick="startMatch()" style="width: 200px; height: 60px; background: var(--red); color: white; border: none; border-radius: 30px; font-size: 20px; font-weight: bold; margin-top: 20px; box-shadow: 0 5px #c0392b;">В БОЙ</button>
        <p id="status-text" style="margin-top: 20px; color: var(--blue);"></p>
    </div>

    <div id="profile" class="screen">
        <h3>ПРОФИЛЬ</h3>
        <input type="text" id="nick-input" placeholder="Никнейм" style="padding: 10px; border-radius: 5px; width: 80%;">
        <button onclick="saveProfile()" style="margin-top: 10px; padding: 10px 20px;">Сохранить</button>
    </div>

    <div class="tabs">
        <div class="tab" onclick="switchTab('deck')">🃏 Колода</div>
        <div class="tab active" onclick="switchTab('main')">⚔️ Бой</div>
        <div class="tab" onclick="switchTab('profile')">👤 Профиль</div>
    </div>
</div>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
        <div class="opp-info"><span id="opp-nick">...</span> | 🏆 <span id="opp-t">0</span></div>
        <div class="timer" id="game-timer">02:00</div>
        
        <div class="emoji-btn" onclick="toggleEmoji()">💬</div>
        <div class="emoji-panel" id="emoji-panel">
            <span onclick="sendEmoji('👍')">👍</span>
            <span onclick="sendEmoji('👎')">👎</span>
            <span onclick="sendEmoji('❤️')">❤️</span>
            <span onclick="sendEmoji('😭')">😭</span>
            <span onclick="sendEmoji('🤣')">🤣</span>
        </div>

        <div class="battle-bottom">
            <div class="elixir-num">💧 <span id="elixir-val">0</span> / 10</div>
            <div class="elixir-container">
                <div class="elixir-fill" id="elixir-bar"></div>
            </div>
            <div class="hand">
                <div id="hand-cards" style="display: flex; gap: 5px;"></div>
                <div id="next-card-view" class="hand-card next-card"></div>
            </div>
        </div>
    </div>
</div>

<div id="result-screen">
    <h1 id="res-title">ПОБЕДА</h1>
    <h2 id="res-diff" style="color: var(--gold);">+30</h2>
    <button onclick="location.reload()" style="padding: 15px 40px; border-radius: 10px; border: none; background: white; font-weight: bold;">В МЕНЮ</button>
</div>

<script>
    const UNITS = [
        {id:0, name:"Рыцарь", cost:3, color:'#3498db'}, {id:1, name:"Лучник", cost:2, color:'#e67e22'},
        {id:2, name:"Гигант", cost:5, color:'#d35400'}, {id:3, name:"Скелет", cost:1, color:'#bdc3c7'},
        {id:4, name:"Мушкетер", cost:4, color:'#9b59b6'}, {id:5, name:"М.Пекка", cost:4, color:'#2980b9'},
        {id:6, name:"Принц", cost:5, color:'#f1c40f'}, {id:7, name:"Дракон", cost:4, color:'#2ecc71'},
        {id:8, name:"Валкирия", cost:4, color:'#e74c3c'}, {id:9, name:"Маг", cost:5, color:'#34495e'}
    ];

    let myData = {
        name: localStorage.getItem('bn_name') || "Игрок",
        trophies: parseInt(localStorage.getItem('bn_trophies')) || 0,
        deck: JSON.parse(localStorage.getItem('bn_deck')) || [0, 1, 2, 3, 4]
    };

    let battleData = {
        hand: [], queue: [], selectedIdx: -1, elixir: 5, active: false, role: 'p1', emojis: []
    };

    let socket;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- Инициализация ---
    function init() {
        document.getElementById('user-trophies').innerText = myData.trophies;
        document.getElementById('user-name-display').innerText = myData.name;
        document.getElementById('nick-input').value = myData.name;
        renderDeck();
        resize();
        window.onresize = resize;
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function switchTab(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function saveProfile() {
        myData.name = document.getElementById('nick-input').value;
        localStorage.setItem('bn_name', myData.name);
        alert("Сохранено!");
        location.reload();
    }

    function renderDeck() {
        const list = document.getElementById('deck-list');
        list.innerHTML = '';
        UNITS.forEach(u => {
            const isSel = myData.deck.includes(u.id);
            const d = document.createElement('div');
            d.className = `card ${isSel ? 'selected' : ''}`;
            d.innerHTML = `<div class="cost">${u.cost}</div>${u.name}`;
            d.onclick = () => {
                if(isSel) myData.deck = myData.deck.filter(i => i !== u.id);
                else if(myData.deck.length < 5) myData.deck.push(u.id);
                localStorage.setItem('bn_deck', JSON.stringify(myData.deck));
                renderDeck();
            };
            list.appendChild(d);
        });
    }

    // --- Логика Боя ---
    function startMatch() {
        if(myData.deck.length < 5) return alert("Выбери 5 карт!");
        document.getElementById('status-text').innerText = "Поиск противника...";
        
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${protocol}//${location.host}`);

        socket.onopen = () => {
            socket.send(JSON.stringify({ type: 'join', name: myData.name, trophies: myData.trophies, deck: myData.deck }));
        };

        socket.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if(data.type === 'match_start') {
                battleData.role = data.role;
                document.getElementById('opp-nick').innerText = data.oppName;
                document.getElementById('opp-t').innerText = data.oppTrophies;
                setupBattle();
            }
            if(data.type === 'sync') {
                drawGame(data);
                battleData.elixir = Math.min(10, battleData.elixir + (data.suddenDeath ? 0.02 : 0.01));
                updateHUD(data.timer);
            }
            if(data.type === 'emoji') {
                showEmoji(data.emoji, data.isOpponent);
            }
            if(data.type === 'game_over') {
                showResults(data.winner === battleData.role);
            }
        };
    }

    function setupBattle() {
        document.getElementById('ui-layer').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        battleData.active = true;
        battleData.hand = myData.deck.slice(0, 4);
        battleData.queue = [myData.deck[4]];
        renderHand();
    }

    function renderHand() {
        const handCont = document.getElementById('hand-cards');
        handCont.innerHTML = '';
        battleData.hand.forEach((id, idx) => {
            const u = UNITS.find(un => un.id === id);
            const d = document.createElement('div');
            d.className = `hand-card ${battleData.selectedIdx === idx ? 'active' : ''}`;
            d.innerHTML = `<b>${u.cost}💧</b><br>${u.name}`;
            d.onclick = (e) => {
                e.stopPropagation();
                battleData.selectedIdx = (battleData.selectedIdx === idx ? -1 : idx);
                renderHand();
            };
            handCont.appendChild(d);
        });

        const nextU = UNITS.find(un => un.id === battleData.queue[0]);
        document.getElementById('next-card-view').innerHTML = `След:<br>${nextU.name}`;
    }

    function updateHUD(timer) {
        document.getElementById('elixir-val').innerText = Math.floor(battleData.elixir);
        document.getElementById('elixir-bar').style.width = (battleData.elixir * 10) + '%';
        const m = Math.floor(timer/60), s = timer%60;
        document.getElementById('game-timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
    }

    canvas.addEventListener('click', (e) => {
        if(!battleData.active || battleData.selectedIdx === -1) return;
        const uId = battleData.hand[battleData.selectedIdx];
        const cost = UNITS.find(un => un.id === uId).cost;

        if(battleData.elixir >= cost) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / canvas.width;
            const y = (e.clientY - rect.top) / canvas.height;

            // Проверка зоны высадки
            const isMyHalf = (battleData.role === 'p1' && y > 0.55) || (battleData.role === 'p2' && y < 0.45);
            if(!isMyHalf) return;

            socket.send(JSON.stringify({ type: 'place_unit', unitId: uId, x, y }));
            
            battleData.elixir -= cost;
            const played = battleData.hand.splice(battleData.selectedIdx, 1)[0];
            battleData.hand.push(battleData.queue.shift());
            battleData.queue.push(played);
            
            battleData.selectedIdx = -1;
            renderHand();
        }
    });

    function drawGame(data) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Река
        ctx.fillStyle = '#2980b9';
        ctx.fillRect(0, canvas.height * 0.48, canvas.width, canvas.height * 0.04);

        // Башни
        data.towers.forEach(t => {
            ctx.fillStyle = t.owner === battleData.role ? '#3498db' : '#e74c3c';
            ctx.beginPath();
            ctx.arc(t.x * canvas.width, t.y * canvas.height, 25, 0, Math.PI*2);
            ctx.fill();
            // HP
            ctx.fillStyle = 'white';
            ctx.fillRect(t.x * canvas.width - 20, t.y * canvas.height - 35, 40, 6);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(t.x * canvas.width - 20, t.y * canvas.height - 35, 40 * (t.hp/2000), 6);
        });

        // Юниты
        data.units.forEach(u => {
            const unitType = UNITS.find(un => un.id === u.unitId);
            ctx.fillStyle = u.owner === battleData.role ? '#3498db' : '#e74c3c';
            ctx.beginPath();
            ctx.arc(u.x * canvas.width, u.y * canvas.height, 12, 0, Math.PI*2);
            ctx.fill();
        });

        // Эмодзи
        battleData.emojis.forEach((em, i) => {
            ctx.font = "40px Arial";
            ctx.fillText(em.t, em.x, em.y);
            em.l--;
            if(em.l <= 0) battleData.emojis.splice(i, 1);
        });
    }

    function toggleEmoji() {
        const p = document.getElementById('emoji-panel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    function sendEmoji(e) {
        socket.send(JSON.stringify({ type: 'emoji', emoji: e }));
        toggleEmoji();
    }

    function showEmoji(e, isOpp) {
        battleData.emojis.push({
            t: e, x: canvas.width/2 - 20, y: isOpp ? 150 : canvas.height - 200, l: 60
        });
    }

    function showResults(win) {
        battleData.active = false;
        const change = win ? 30 : -25;
        myData.trophies = Math.max(0, myData.trophies + change);
        localStorage.setItem('bn_trophies', myData.trophies);
        
        document.getElementById('result-screen').style.display = 'flex';
        document.getElementById('res-title').innerText = win ? "ПОБЕДА!" : "ПОРАЖЕНИЕ";
        document.getElementById('res-diff').innerText = (win ? "+" : "") + change + " кубков";
    }

    init();
</script>
</body>
</html>
