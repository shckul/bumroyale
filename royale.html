<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bum Royale Pro</title>
    <style>
        :root {
            --primary: #3498db; --secondary: #2ecc71; --danger: #e74c3c;
            --dark: #2c3e50; --elixir: #d32ce6; --bg: #1a1a1a;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: white; overflow: hidden; touch-action: manipulation; }
        
        /* UI */
        .tabs { display: flex; background: #222; height: 60px; }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #888; }
        .tab.active { color: var(--primary); border-bottom: 4px solid var(--primary); background: #2a2a2a; }
        .screen { display: none; height: calc(100vh - 60px); padding: 20px; overflow-y: auto; }
        .screen.active { display: block; }

        /* Deck */
        .unit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .unit-card { background: #333; border-radius: 8px; padding: 10px; text-align: center; border: 2px solid transparent; position: relative; }
        .unit-card.in-deck { border-color: var(--secondary); }
        .cost-badge { position: absolute; top: -5px; left: -5px; background: var(--elixir); width: 24px; height: 24px; border-radius: 50%; font-size: 12px; display: flex; align-items: center; justify-content: center; }

        /* Game Overlay */
        #game-overlay { display: none; position: fixed; inset: 0; background: #3a7d44; z-index: 1000; }
        canvas { display: block; background: #4a954d; margin: 0 auto; }
        
        .hud { position: absolute; inset: 0; pointer-events: none; }
        .hud-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
        .hud-bottom { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); padding: 10px; pointer-events: auto; z-index: 1100; }
        
        .elixir-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .elixir-bar { flex: 1; height: 12px; background: #222; border-radius: 6px; overflow: hidden; }
        #elixir-fill { height: 100%; background: var(--elixir); width: 0%; transition: width 0.2s; }
        
        .battle-hand { display: flex; justify-content: center; gap: 5px; }
        .hand-card { width: 65px; height: 85px; background: #eee; border-radius: 5px; color: #222; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border: 2px solid #fff; font-size: 11px; font-weight: bold; }
        .hand-card.selected { border-color: #f1c40f; transform: translateY(-5px); }
        .hand-card.disabled { opacity: 0.5; filter: grayscale(1); }

        /* Emoji System - Fixed */
        .emoji-panel { 
            position: absolute; bottom: 130px; right: 10px; 
            background: rgba(0,0,0,0.9); padding: 10px; border-radius: 15px; 
            display: none; gap: 10px; pointer-events: auto; z-index: 1200;
        }
        .emoji-btn { font-size: 30px; cursor: pointer; user-select: none; }
        .emoji-trigger { pointer-events: auto; background: #444; border: none; border-radius: 50%; width: 40px; height: 40px; color: white; cursor: pointer; }

        #result-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
        .btn-battle { background: var(--danger); color: white; border: none; padding: 15px 40px; font-size: 20px; border-radius: 30px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div id="main-menu">
    <div class="tabs">
        <div class="tab" onclick="switchTab('deck-tab')">ДЕКА</div>
        <div class="tab active" onclick="switchTab('battle-tab')">БОЙ</div>
        <div class="tab" onclick="switchTab('profile-tab')">ПРОФИЛЬ</div>
    </div>
    <div id="deck-tab" class="screen">
        <h3>Колода (<span id="deck-size">0</span>/5)</h3>
        <div class="unit-grid" id="unit-list"></div>
    </div>
    <div id="battle-tab" class="screen active" style="text-align: center;">
        <h2 id="menu-nick">Загрузка...</h2>
        <h1 style="color: #f1c40f;">🏆 <span id="menu-trophies">0</span></h1>
        <button class="btn-battle" onclick="startSearch()">В БОЙ</button>
        <p id="search-status"></p>
    </div>
    <div id="profile-tab" class="screen">
        <h3>Профиль</h3>
        <input type="text" id="nick-input" class="profile-input" style="width: 100%; padding: 10px; margin-bottom: 20px;">
        <button class="btn-battle" onclick="saveProfile()">Сохранить</button>
    </div>
</div>

<div id="game-overlay">
    <canvas id="canvas"></canvas>
    <div class="hud">
        <div class="hud-top">
            <div id="enemy-info">Враг: 0</div>
            <div id="timer">02:00</div>
        </div>
        <div class="emoji-panel" id="emoji-panel">
            <div class="emoji-btn" onclick="sendEmoji('👍')">👍</div>
            <div class="emoji-btn" onclick="sendEmoji('👎')">👎</div>
            <div class="emoji-btn" onclick="sendEmoji('❤️')">❤️</div>
            <div class="emoji-btn" onclick="sendEmoji('😭')">😭</div>
        </div>
        <div class="hud-bottom">
            <div class="elixir-row">
                <span id="elixir-text" style="font-weight: bold; color: var(--elixir); width: 20px;">5</span>
                <div class="elixir-bar"><div id="elixir-fill"></div></div>
                <button class="emoji-trigger" onclick="toggleEmoji()">💬</button>
            </div>
            <div class="battle-hand" id="hand-ui"></div>
        </div>
    </div>
</div>

<div id="result-overlay">
    <h1 id="res-title">ПОБЕДА</h1>
    <h2 id="res-trophies">+30 🏆</h2>
    <button class="btn-battle" onclick="location.reload()">ВЫХОД</button>
</div>

<script>
/** --- ДАННЫЕ --- **/
const UNITS = [
    { id: 0, name: "Рыцарь", cost: 3, hp: 800, dmg: 70, range: 40, speed: 1.5, color: '#f1c40f' },
    { id: 1, name: "Лучник", cost: 2, hp: 350, dmg: 40, range: 180, speed: 1.8, color: '#e67e22' },
    { id: 2, name: "Гигант", cost: 5, hp: 2800, dmg: 100, range: 40, speed: 0.8, color: '#d35400' },
    { id: 3, name: "Скелет", cost: 1, hp: 100, dmg: 30, range: 30, speed: 2.5, color: '#ecf0f1' },
    { id: 4, name: "Маг", cost: 4, hp: 550, dmg: 120, range: 150, speed: 1.4, color: '#9b59b6' },
    { id: 5, name: "Миньон", cost: 3, hp: 200, dmg: 50, range: 40, speed: 2.8, color: '#3498db' },
    { id: 6, name: "Пекка", cost: 7, hp: 3200, dmg: 450, range: 50, speed: 0.7, color: '#2c3e50' },
    { id: 7, name: "Принц", cost: 5, hp: 1500, dmg: 220, range: 50, speed: 3.0, color: '#c0392b' },
    { id: 8, name: "Гоблин", cost: 2, hp: 250, dmg: 40, range: 30, speed: 2.6, color: '#2ecc71' },
    { id: 9, name: "Дракон", cost: 4, hp: 1000, dmg: 90, range: 120, speed: 2.0, color: '#1abc9c' }
];

let player = {
    nick: localStorage.getItem('rn') || "Игрок",
    trophies: parseInt(localStorage.getItem('rt')) || 0,
    deck: JSON.parse(localStorage.getItem('rd')) || [0, 1, 2, 3, 4]
};

/** --- МЕНЮ --- **/
function switchTab(id) {
    document.querySelectorAll('.screen, .tab').forEach(e => e.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.currentTarget.classList.add('active');
    if(id === 'deck-tab') renderDeck();
}

function saveProfile() {
    player.nick = document.getElementById('nick-input').value;
    localStorage.setItem('rn', player.nick);
    updateUI();
}

function updateUI() {
    document.getElementById('menu-nick').innerText = player.nick;
    document.getElementById('menu-trophies').innerText = player.trophies;
    document.getElementById('deck-size').innerText = player.deck.length;
    document.getElementById('nick-input').value = player.nick;
}

function renderDeck() {
    const list = document.getElementById('unit-list');
    list.innerHTML = '';
    UNITS.forEach(u => {
        const inD = player.deck.includes(u.id);
        const card = document.createElement('div');
        card.className = `unit-card ${inD ? 'in-deck' : ''}`;
        card.innerHTML = `<div class="cost-badge">${u.cost}</div><b>${u.name}</b>`;
        card.onclick = () => {
            if(inD) player.deck = player.deck.filter(i => i !== u.id);
            else if(player.deck.length < 5) player.deck.push(u.id);
            localStorage.setItem('rd', JSON.stringify(player.deck));
            renderDeck(); updateUI();
        };
        list.appendChild(card);
    });
}

/** --- БОЙ --- **/
let ws, gameActive = false, isP1 = false, enemy = {};
let elixir = 5, hand = [], queue = [], selectedCard = null;
let entities = [], matchTime = 120, isSD = false;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function startSearch() {
    if(player.deck.length < 5) return alert("Нужно 5 карт!");
    document.getElementById('search-status').innerText = "Поиск...";
    
    const host = 'bumroyale.onrender.com';
    ws = new WebSocket(`wss://${host}`);

    ws.onopen = () => ws.send(JSON.stringify({ type: 'join', nick: player.nick, trophies: player.trophies }));
    ws.onmessage = (m) => {
        const d = JSON.parse(m.data);
        if(d.type === 'start') { isP1 = d.role === 'p1'; enemy = d.enemy; initGame(); }
        if(d.type === 'spawn') doSpawn(d.unitId, d.x, d.y, false);
        if(d.type === 'emoji') showEmoji(d.emoji, false);
    };
}

function initGame() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('game-overlay').style.display = 'block';
    
    canvas.width = Math.min(window.innerWidth, 400);
    canvas.height = window.innerHeight;

    let d = [...player.deck].sort(() => Math.random() - 0.5);
    hand = d.slice(0, 4); queue = [d[4]];

    const cx = canvas.width/2;
    const h = canvas.height;
    // Смещение башен выше, чтобы рука их не закрывала
    const pY = h - 220; 
    const eY = 100;

    entities.push(new Tower(cx, pY + 60, 2500, true, false));
    entities.push(new Tower(cx - 80, pY, 1400, false, false));
    entities.push(new Tower(cx + 80, pY, 1400, false, false));
    
    entities.push(new Tower(cx, eY - 40, 2500, true, true));
    entities.push(new Tower(cx - 80, eY, 1400, false, true));
    entities.push(new Tower(cx + 80, eY, 1400, false, true));

    gameActive = true; updateHUD();
    loop();
    setInterval(() => {
        if(!gameActive) return;
        elixir = Math.min(10, elixir + (isSD ? 0.4 : 0.2));
        if(matchTime > 0) matchTime--; else isSD = true;
        updateHUD();
    }, 1000);
}

class Tower {
    constructor(x, y, hp, king, enemy) {
        Object.assign(this, { x, y, hp, max: hp, king, enemy, type: 'tower', range: 160 });
    }
    draw() {
        ctx.fillStyle = this.enemy ? '#e74c3c' : '#3498db';
        let s = this.king ? 36 : 28;
        ctx.fillRect(this.x - s/2, this.y - s/2, s, s);
        ctx.fillStyle = 'red'; ctx.fillRect(this.x - 15, this.y - s/2 - 8, 30 * (this.hp/this.max), 4);
    }
    update() {
        let t = entities.find(e => e.enemy !== this.enemy && e.type === 'unit' && Math.hypot(e.x-this.x, e.y-this.y) < this.range);
        if(t) t.hp -= 0.5;
    }
}

class Unit {
    constructor(cfg, x, y, enemy) {
        Object.assign(this, cfg);
        this.x = x; this.y = y; this.enemy = enemy; this.max = cfg.hp; this.type = 'unit';
    }
    draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, 10, 0, 7);
        ctx.fillStyle = this.color; ctx.fill();
        ctx.fillStyle = 'red'; ctx.fillRect(this.x - 10, this.y - 15, 20 * (this.hp/this.max), 3);
    }
    update() {
        let targets = entities.filter(e => e.enemy !== this.enemy);
        let t = targets.sort((a,b) => Math.hypot(a.x-this.x, a.y-this.y) - Math.hypot(b.x-this.x, b.y-this.y))[0];
        if(!t) return;

        let dist = Math.hypot(t.x-this.x, t.y-this.y);
        if(dist > this.range) {
            let tx = t.x, ty = t.y;
            // Логика мостов
            const riverY = canvas.height / 2;
            const onMySide = this.enemy ? (this.y < riverY - 20) : (this.y > riverY + 20);
            if(onMySide) {
                // Идем к ближайшему мосту
                tx = (this.x < canvas.width/2) ? 60 : canvas.width - 60;
                ty = riverY;
            }

            let angle = Math.atan2(ty - this.y, tx - this.x);
            this.x += Math.cos(angle) * this.speed;
            this.y += Math.sin(angle) * this.speed;
        } else {
            t.hp -= this.dmg / 60;
        }
    }
}

function loop() {
    if(!gameActive) return;
    ctx.clearRect(0,0,canvas.width, canvas.height);
    
    // Река и мосты
    ctx.fillStyle = '#2980b9'; ctx.fillRect(0, canvas.height/2 - 15, canvas.width, 30);
    ctx.fillStyle = '#95a5a6'; 
    ctx.fillRect(40, canvas.height/2 - 20, 40, 40); // Мост 1
    ctx.fillRect(canvas.width - 80, canvas.height/2 - 20, 40, 40); // Мост 2

    entities = entities.filter(e => e.hp > 0);
    entities.forEach(e => { e.update(); e.draw(); });

    if(!entities.find(e => e.king && e.enemy)) finish(true);
    if(!entities.find(e => e.king && !e.enemy)) finish(false);

    requestAnimationFrame(loop);
}

function doSpawn(id, x, y, local) {
    const cfg = UNITS.find(u => u.id === id);
    let fx = local ? x : canvas.width - x;
    let fy = local ? y : canvas.height - y;
    entities.push(new Unit(cfg, fx, fy, !local));
    if(local) {
        elixir -= cfg.cost;
        ws.send(JSON.stringify({ type: 'spawn', unitId: id, x, y }));
        let idx = hand.indexOf(id);
        hand[idx] = queue.shift();
        queue.push(id);
        selectedCard = null;
        updateHUD();
    }
}

canvas.addEventListener('touchstart', (e) => {
    if(selectedCard === null) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.touches[0].clientX - rect.left;
    const y = e.touches[0].clientY - rect.top;
    if(y > canvas.height/2 + 20) doSpawn(selectedCard, x, y, true);
});

function updateHUD() {
    document.getElementById('elixir-text').innerText = Math.floor(elixir);
    document.getElementById('elixir-fill').style.width = (elixir*10)+'%';
    let m = Math.floor(matchTime/60), s = matchTime%60;
    document.getElementById('timer').innerText = `${m}:${s<10?'0'+s:s}`;
    document.getElementById('enemy-info').innerText = `${enemy.nick || 'Враг'}: ${enemy.trophies || 0}`;

    const hUI = document.getElementById('hand-ui');
    hUI.innerHTML = '';
    hand.forEach(id => {
        const u = UNITS.find(x => x.id === id);
        const card = document.createElement('div');
        card.className = `hand-card ${elixir < u.cost ? 'disabled' : ''} ${selectedCard === id ? 'selected' : ''}`;
        card.innerHTML = `<div style="color:var(--elixir)">${u.cost}</div>${u.name}`;
        card.onclick = () => { if(elixir >= u.cost) selectedCard = id; updateHUD(); };
        hUI.appendChild(card);
    });
}

function toggleEmoji() {
    const p = document.getElementById('emoji-panel');
    p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
}

function sendEmoji(e) {
    showEmoji(e, true);
    ws.send(JSON.stringify({ type: 'emoji', emoji: e }));
    toggleEmoji();
}

function showEmoji(e, local) {
    const div = document.createElement('div');
    div.style.cssText = `position:fixed; font-size:40px; left:50%; z-index:1500; top:${local?'70%':'20%'}; animation: float 2s forwards;`;
    div.innerText = e;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 2000);
}

function finish(win) {
    gameActive = false;
    const d = win ? 30 : -25;
    player.trophies = Math.max(0, player.trophies + d);
    localStorage.setItem('rt', player.trophies);
    document.getElementById('res-title').innerText = win ? "ПОБЕДА" : "ПОРАЖЕНИЕ";
    document.getElementById('res-trophies').innerText = `${d > 0 ? '+' : ''}${d} 🏆`;
    document.getElementById('result-overlay').style.display = 'flex';
}

updateUI();
</script>
<style> @keyframes float { 0% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-100px); } } </style>
</body>
</html>
