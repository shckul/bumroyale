<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Royale Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #1a1a1a; touch-action: manipulation; overflow: hidden; font-family: sans-serif; }
        .tab-active { border-bottom: 4px solid #facc15; color: #facc15; }
        canvas { touch-action: none; background: #4ade80; border: 4px solid #166534; border-radius: 8px; }
        .card-selected { border: 3px solid #facc15; transform: translateY(-10px); }
        .emoji-bubble { animation: float 2s ease-in-out forwards; }
        @keyframes float { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-50px); } }
    </style>
</head>
<body class="text-white select-none">

<div id="app" class="h-screen flex flex-col max-w-md mx-auto relative">
    
    <!-- UI: MAIN MENU -->
    <div id="main-menu" class="flex-1 flex flex-col p-4">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black italic tracking-tighter">CLASH <span class="text-yellow-400">MOBILE</span></h1>
            <div class="bg-blue-600 px-3 py-1 rounded-full font-bold">🏆 <span id="user-trophies">1000</span></div>
        </header>

        <div id="tab-decks" class="tab-content flex-1">
            <h2 class="text-center font-bold mb-4 uppercase">Выберите колоду (5 из 10)</h2>
            <div id="deck-grid" class="grid grid-cols-5 gap-2"></div>
        </div>

        <div id="tab-battle" class="tab-content flex-1 flex flex-col justify-center items-center hidden">
            <button id="btn-search" class="bg-yellow-500 hover:bg-yellow-400 text-black text-3xl font-black px-12 py-6 rounded-2xl shadow-[0_8px_0_rgb(161,98,7)] active:translate-y-1 active:shadow-none transition-all">
                В БОЙ
            </button>
            <p id="search-status" class="mt-4 text-gray-400 italic">Нажмите кнопку для поиска...</p>
        </div>

        <div id="tab-settings" class="tab-content flex-1 hidden text-center">
            <label class="block mb-2">Никнейм:</label>
            <input type="text" id="username-input" class="bg-gray-800 border-2 border-gray-700 rounded p-2 text-center w-full" value="Player1">
        </div>

        <nav class="flex justify-around border-t border-gray-800 bg-gray-900 py-4 mt-auto">
            <button onclick="switchTab('decks')" id="nav-decks" class="font-bold uppercase tab-active">Колоды</button>
            <button onclick="switchTab('battle')" id="nav-battle" class="font-bold uppercase">Бой</button>
            <button onclick="switchTab('settings')" id="nav-settings" class="font-bold uppercase">Настройки</button>
        </nav>
    </div>

    <!-- UI: BATTLE SCREEN -->
    <div id="battle-screen" class="hidden fixed inset-0 bg-green-900 flex flex-col p-2">
        <div class="flex justify-between items-center bg-black/40 p-2 rounded">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-red-500 rounded-lg"></div>
                <div>
                    <div id="enemy-name" class="font-bold text-xs uppercase">Enemy</div>
                    <div class="text-[10px] text-yellow-400 font-bold">🏆 <span id="enemy-trophies">1000</span></div>
                </div>
            </div>
            <div id="timer" class="text-2xl font-black italic">02:00</div>
            <div id="emoji-container-enemy" class="relative w-12 h-12"></div>
        </div>

        <div class="flex-1 relative mt-2 flex justify-center items-center">
            <canvas id="gameCanvas"></canvas>
            <div id="emoji-display" class="absolute pointer-events-none"></div>
        </div>

        <div class="h-48 flex flex-col gap-2 pt-2">
            <div class="flex justify-between items-end px-2">
                <div class="flex gap-2" id="hand-cards"></div>
                <div class="flex flex-col items-center">
                    <span class="text-[10px] font-bold uppercase opacity-50">Next</span>
                    <div id="next-card" class="w-10 h-14 bg-gray-700 rounded border-2 border-gray-500 flex items-center justify-center scale-75"></div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div class="flex-1 bg-blue-900 h-6 rounded-full border-2 border-white relative overflow-hidden">
                    <div id="elixir-bar" class="h-full bg-pink-500 transition-all duration-300" style="width: 0%"></div>
                    <div id="elixir-text" class="absolute inset-0 flex justify-center items-center text-xs font-bold">0</div>
                </div>
                <button onclick="toggleEmojiPanel()" class="bg-blue-600 p-2 rounded-full shadow-lg text-lg">💬</button>
            </div>
        </div>

        <div id="emoji-panel" class="hidden absolute bottom-20 right-2 bg-gray-900 p-3 rounded-2xl grid grid-cols-2 gap-3 border-2 border-blue-500">
            <button onclick="sendEmoji('🔥')" class="text-2xl hover:scale-110">🔥</button>
            <button onclick="sendEmoji('😭')" class="text-2xl hover:scale-110">😭</button>
            <button onclick="sendEmoji('😠')" class="text-2xl hover:scale-110">😠</button>
            <button onclick="sendEmoji('😎')" class="text-2xl hover:scale-110">😎</button>
        </div>
    </div>

    <!-- UI: GAME OVER -->
    <div id="game-over" class="hidden fixed inset-0 bg-black/90 flex flex-col justify-center items-center z-50 text-center p-6">
        <h2 id="result-text" class="text-5xl font-black italic mb-4">ПОБЕДА!</h2>
        <div class="text-xl mb-8">
            <p id="final-players"></p>
            <p id="trophy-change" class="text-green-400 font-bold mt-2">+30 ТРОФЕЕВ</p>
        </div>
        <button onclick="location.reload()" class="bg-white text-black font-bold px-8 py-3 rounded-xl">ВЕРНУТЬСЯ В МЕНЮ</button>
    </div>
</div>

<script>
const state = {
    username: "Player",
    trophies: 1000,
    deck: [],
    availableUnits: [
        { id: 1, name: 'Воин', color: 'blue', cost: 3, hp: 100, dmg: 10 },
        { id: 2, name: 'Лук', color: 'green', cost: 2, hp: 50, dmg: 15 },
        { id: 3, name: 'Гигант', color: 'orange', cost: 5, hp: 250, dmg: 5 },
        { id: 4, name: 'Маг', color: 'purple', cost: 4, hp: 70, dmg: 20 },
        { id: 5, name: 'Рыцарь', color: 'cyan', cost: 3, hp: 120, dmg: 8 },
        { id: 6, name: 'Миньон', color: 'indigo', cost: 3, hp: 40, dmg: 12 },
        { id: 7, name: 'Скелет', color: 'white', cost: 1, hp: 20, dmg: 5 },
        { id: 8, name: 'Пушка', color: 'gray', cost: 3, hp: 150, dmg: 10 },
        { id: 9, name: 'Дракон', color: 'red', cost: 4, hp: 100, dmg: 18 },
        { id: 10, name: 'Валкирия', color: 'brown', cost: 4, hp: 140, dmg: 12 }
    ],
    hand: [],
    nextCard: null,
    elixir: 0,
    inBattle: false,
    battleTime: 120,
    isOvertime: false,
    socket: null,
    selectedCardIdx: null,
    serverUnits: [], // Данные от сервера
    serverTowers: null
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scale = window.devicePixelRatio || 1;

function init() {
    const grid = document.getElementById('deck-grid');
    state.availableUnits.forEach(unit => {
        const div = document.createElement('div');
        div.className = `h-20 bg-gray-800 rounded-lg flex flex-col items-center justify-center border-2 border-transparent cursor-pointer`;
        div.innerHTML = `<span class="text-xs font-bold">${unit.name}</span><span class="text-pink-500 text-xs">${unit.cost}💧</span>`;
        div.onclick = () => toggleCardInDeck(unit, div);
        grid.appendChild(div);
    });

    state.socket = new WebSocket('wss://your-server-on-render.com');
    state.socket.onmessage = handleSocketMessage;

    resize();
    window.addEventListener('resize', resize);
    document.getElementById('btn-search').onclick = startSearch;
}

function resize() {
    const parent = canvas.parentElement;
    canvas.width = parent.clientWidth * scale;
    canvas.height = parent.clientHeight * scale;
    canvas.style.width = parent.clientWidth + 'px';
    canvas.style.height = parent.clientHeight + 'px';
}

function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('nav button').forEach(el => el.classList.remove('tab-active'));
    document.getElementById(`tab-${tab}`).classList.remove('hidden');
    document.getElementById(`nav-${tab}`).classList.add('tab-active');
}

function toggleCardInDeck(unit, el) {
    const idx = state.deck.findIndex(u => u.id === unit.id);
    if (idx > -1) {
        state.deck.splice(idx, 1);
        el.style.borderColor = 'transparent';
    } else if (state.deck.length < 5) {
        state.deck.push(unit);
        el.style.borderColor = '#facc15';
    }
}

function startSearch() {
    if (state.deck.length < 5) return alert("Выберите 5 карт!");
    state.username = document.getElementById('username-input').value;
    document.getElementById('search-status').innerText = "Поиск противника...";
    state.socket.send(JSON.stringify({ type: 'MATCHMAKING', user: state.username, deck: state.deck }));
    setTimeout(startBattle, 2000);
}

function startBattle() {
    state.inBattle = true;
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('battle-screen').classList.remove('hidden');
    let shuffleDeck = [...state.deck].sort(() => Math.random() - 0.5);
    state.hand = shuffleDeck.slice(0, 4);
    state.nextCard = shuffleDeck[4];
    renderHand();
    requestAnimationFrame(gameLoop);
    startTimers();
}

function renderHand() {
    const container = document.getElementById('hand-cards');
    container.innerHTML = '';
    state.hand.forEach((unit, idx) => {
        const div = document.createElement('div');
        div.className = `w-14 h-20 bg-blue-700 rounded-lg border-2 border-white flex flex-col items-center justify-center transition-all ${state.selectedCardIdx === idx ? 'card-selected' : ''}`;
        div.innerHTML = `<span class="text-[10px] font-bold">${unit.name}</span><span class="text-xs">💧${unit.cost}</span>`;
        div.onclick = () => { state.selectedCardIdx = idx; renderHand(); };
        container.appendChild(div);
    });
    const nextContainer = document.getElementById('next-card');
    nextContainer.innerHTML = `<span class="text-[8px]">${state.nextCard.name}</span>`;
}

function startTimers() {
    const timerEl = document.getElementById('timer');
    const interval = setInterval(() => {
        if (!state.inBattle) return clearInterval(interval);
        if (state.elixir < 10) {
            state.elixir += state.isOvertime ? 0.2 : 0.1;
            updateElixirUI();
        }
        let m = Math.floor(state.battleTime / 60);
        let s = state.battleTime % 60;
        timerEl.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }, 1000);
}

function updateElixirUI() {
    const bar = document.getElementById('elixir-bar');
    const text = document.getElementById('elixir-text');
    const val = Math.floor(state.elixir);
    bar.style.width = (val * 10) + '%';
    text.innerText = val;
}

function gameLoop() {
    if (!state.inBattle) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawArena();

    // Отрисовка юнитов от сервера
    if (state.serverUnits) {
        state.serverUnits.forEach(unit => {
            ctx.fillStyle = unit.owner === 'p1' ? '#3b82f6' : '#ef4444';
            ctx.beginPath();
            ctx.arc(unit.x * canvas.width, unit.y * canvas.height, 12 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();
        });
    }
    requestAnimationFrame(gameLoop);
}

function drawArena() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = '#3b82f6';
    ctx.fillRect(0, h/2 - 20*scale, w, 40*scale);
    ctx.fillStyle = '#78350f';
    ctx.fillRect(w*0.2, h/2 - 25*scale, 50*scale, 50*scale);
    ctx.fillRect(w*0.7, h/2 - 25*scale, 50*scale, 50*scale);
    drawTower(w/2, 60*scale, 'red');
    drawTower(w*0.2, 120*scale, 'red');
    drawTower(w*0.8, 120*scale, 'red');
    drawTower(w/2, h - 60*scale, 'blue');
    drawTower(w*0.2, h - 120*scale, 'blue');
    drawTower(w*0.8, h - 120*scale, 'blue');
}

function drawTower(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x - 20*scale, y - 20*scale, 40*scale, 40*scale);
    ctx.strokeStyle = 'white';
    ctx.strokeRect(x - 20*scale, y - 20*scale, 40*scale, 40*scale);
}

canvas.addEventListener('touchstart', (e) => {
    if (state.selectedCardIdx === null) return;
    const unit = state.hand[state.selectedCardIdx];
    if (state.elixir >= unit.cost) {
        state.elixir -= unit.cost;
        updateElixirUI();
        const playedCard = state.hand.splice(state.selectedCardIdx, 1)[0];
        state.hand.push(state.nextCard);
        state.nextCard = playedCard;
        state.selectedCardIdx = null;
        renderHand();
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        state.socket.send(JSON.stringify({
            type: 'SPAWN',
            unitId: unit.id,
            x: (touch.clientX - rect.left) / rect.width,
            y: (touch.clientY - rect.top) / rect.height
        }));
    }
});

function toggleEmojiPanel() {
    document.getElementById('emoji-panel').classList.toggle('hidden');
}

function sendEmoji(char) {
    showEmoji(char, 'player');
    state.socket.send(JSON.stringify({ type: 'EMOJI', char: char }));
    toggleEmojiPanel();
}

function showEmoji(char, side) {
    const display = document.getElementById('emoji-display');
    const el = document.createElement('div');
    el.className = 'emoji-bubble text-4xl absolute';
    el.style.left = side === 'player' ? '20%' : '70%';
    el.style.top = side === 'player' ? '70%' : '10%';
    el.innerText = char;
    display.appendChild(el);
    setTimeout(() => el.remove(), 2000);
}

/** 
 * ИСПРАВЛЕННЫЙ ОБРАБОТЧИК (ОШИБКА СО СКРИНШОТА ТУТ) 
 */
function handleSocketMessage(msg) {
    const data = JSON.parse(msg.data);

    if (data.type === 'STATE_UPDATE') {
        state.serverUnits = data.units;
        state.serverTowers = data.towers;
        state.battleTime = data.timer;
    } 

    if (data.type === 'ENEMY_EMOJI') {
        showEmoji(data.char, 'enemy');
    }

    if (data.type === 'GAME_END') {
        endBattle(data.won);
    }
}

function endBattle(won) {
    state.inBattle = false;
    document.getElementById('game-over').classList.remove('hidden');
    const resText = document.getElementById('result-text');
    resText.innerText = won ? "ПОБЕДА!" : "ПОРАЖЕНИЕ";
    resText.className = won ? "text-5xl font-black italic mb-4 text-yellow-400" : "text-5xl font-black italic mb-4 text-red-500";
    document.getElementById('final-players').innerText = `${state.username} vs Enemy`;
    const trophy = document.getElementById('trophy-change');
    trophy.innerText = won ? "+30 ТРОФЕЕВ" : "-25 ТРОФЕЕВ";
    trophy.className = won ? "text-green-400 font-bold mt-2" : "text-red-400 font-bold mt-2";
}

init();
</script>
</body>
</html>
