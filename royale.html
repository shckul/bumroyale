<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Royale 2D</title>
    <style>
        :root {
            --bg: #2c3e50;
            --primary: #3498db;
            --accent: #e74c3c;
            --panel: #ecf0f1;
        }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; overflow: hidden; }
        
        /* Стили Меню */
        #ui-layer { position: absolute; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; }
        .screen { display: none; flex: 1; padding: 20px; box-sizing: border-box; text-align: center; overflow-y: auto; }
        .active { display: block; }
        
        .tabs { display: flex; background: #34495e; height: 60px; }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab.active { border-bottom: 3px solid var(--primary); background: #2c3e50; }

        /* Вкладка Колода */
        .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 20px; }
        .unit-card { background: #fff; color: #000; padding: 10px; border-radius: 8px; cursor: pointer; border: 3px solid transparent; position: relative; }
        .unit-card.selected { border-color: #27ae60; }
        .unit-card .cost { position: absolute; top: -5px; right: -5px; background: #9b59b6; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; }

        /* Вкладка Профиль */
        input { padding: 10px; border-radius: 5px; border: none; width: 80%; margin: 10px 0; }
        .stats { font-size: 24px; margin: 20px; }

        /* Экран Боя */
        #game-container { position: relative; width: 100vw; height: 100vh; background: #27ae60; display: none; }
        canvas { display: block; margin: 0 auto; background: #2ecc71; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .battle-hud { position: absolute; width: 100%; height: 100%; pointer-events: none; }
        .opponent-info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; }
        .timer { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000; }
        
        .elixir-bar-container { position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); width: 80%; height: 20px; background: #34495e; border-radius: 10px; overflow: hidden; }
        .elixir-fill { width: 0%; height: 100%; background: #9b59b6; transition: width 0.1s linear; }
        .elixir-text { position: absolute; bottom: 105px; left: 50%; transform: translateX(-50%); color: #ff00ff; font-weight: bold; }

        .hand { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; pointer-events: auto; }
        .hand-card { width: 65px; height: 80px; background: white; color: black; border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; border: 2px solid #333; }
        .hand-card.active { border-color: gold; transform: translateY(-5px); }
        
        .emoji-btn { position: absolute; bottom: 10px; right: 10px; pointer-events: auto; font-size: 30px; cursor: pointer; }
        .emoji-panel { position: absolute; bottom: 60px; right: 10px; background: rgba(0,0,0,0.8); display: none; grid-template-columns: repeat(2, 1fr); gap: 5px; padding: 5px; border-radius: 10px; pointer-events: auto; }

        /* Итоги */
        #result-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <!-- Вкладки -->
        <div id="deck" class="screen">
            <h2>Ваша Колода (выберите 5)</h2>
            <div id="deck-list" class="unit-grid"></div>
        </div>

        <div id="main" class="screen active">
            <div class="stats">🏆 <span id="trophy-count">0</span></div>
            <button onclick="startMatch()" style="padding: 20px 50px; font-size: 24px; background: #e67e22; color: white; border: none; border-radius: 10px; cursor: pointer;">В БОЙ</button>
            <p id="matchmaking-status"></p>
        </div>

        <div id="profile" class="screen">
            <h2>Профиль</h2>
            <input type="text" id="nickname" placeholder="Введите никнейм" onchange="saveName()">
            <p>Статистика: Победы приносят +30, поражения -25.</p>
        </div>

        <div class="tabs">
            <div class="tab" onclick="showScreen('deck')">🎴 Колода</div>
            <div class="tab active" onclick="showScreen('main')">⚔️ Бой</div>
            <div class="tab" onclick="showScreen('profile')">👤 Профиль</div>
        </div>
    </div>

    <!-- Игровой экран -->
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="battle-hud">
            <div class="opponent-info">
                <span id="opp-name">Соперник</span> | 🏆 <span id="opp-trophies">0</span>
            </div>
            <div class="timer" id="match-timer">02:00</div>
            
            <div class="elixir-text"><span id="elixir-val">0</span> / 10</div>
            <div class="elixir-bar-container">
                <div class="elixir-fill" id="elixir-progress"></div>
            </div>

            <div class="hand" id="player-hand"></div>
            
            <div class="emoji-btn" onclick="toggleEmoji()">💬</div>
            <div class="emoji-panel" id="emoji-panel">
                <div onclick="sendEmoji('👍')">👍</div>
                <div onclick="sendEmoji('👎')">👎</div>
                <div onclick="sendEmoji('❤️')">❤️</div>
                <div onclick="sendEmoji('😭')">😭</div>
                <div onclick="sendEmoji('🤣')">🤣</div>
            </div>
        </div>
    </div>

    <!-- Результат -->
    <div id="result-screen">
        <h1 id="res-title">ПОБЕДА!</h1>
        <p id="res-details"></p>
        <button onclick="location.reload()" style="padding: 15px 30px;">ВЫХОД</button>
    </div>

<script>
    // --- Данные и Настройки ---
    const UNITS_DATA = [
        { id: 0, name: 'Рыцарь', cost: 3, hp: 500, dmg: 50, range: 40, speed: 2, color: '#3498db' },
        { id: 1, name: 'Лучник', cost: 2, hp: 200, dmg: 40, range: 150, speed: 2.5, color: '#e67e22' },
        { id: 2, name: 'Гигант', cost: 5, hp: 1200, dmg: 80, range: 30, speed: 1, color: '#d35400' },
        { id: 3, name: 'Скелет', cost: 1, hp: 50, dmg: 20, range: 30, speed: 3, color: '#ecf0f1' },
        { id: 4, name: 'Мушкетер', cost: 4, hp: 300, dmg: 70, range: 180, speed: 1.8, color: '#9b59b6' },
        { id: 5, name: 'Мини Пекка', cost: 4, hp: 600, dmg: 150, range: 35, speed: 2.5, color: '#2980b9' },
        { id: 6, name: 'Принц', cost: 5, hp: 800, dmg: 100, range: 50, speed: 3.5, color: '#f1c40f' },
        { id: 7, name: 'Дракончик', cost: 4, hp: 450, dmg: 45, range: 100, speed: 2.8, color: '#2ecc71' },
        { id: 8, name: 'Валкирия', cost: 4, hp: 700, dmg: 60, range: 40, speed: 2, color: '#e74c3c' },
        { id: 9, name: 'Маг', cost: 5, hp: 280, dmg: 90, range: 160, speed: 2, color: '#34495e' }
    ];

    let player = {
        name: localStorage.getItem('royale_name') || 'Игрок',
        trophies: parseInt(localStorage.getItem('royale_trophies')) || 0,
        deck: [0, 1, 2, 3, 4],
        queue: [],
        hand: []
    };

    let gameState = {
        isMatch: false,
        elixir: 5,
        timer: 120,
        suddenDeath: false,
        selectedCardIdx: -1,
        units: [],
        towers: [],
        emojis: [],
        role: 'spectator' // 'player1' (bottom) or 'player2' (top)
    };

    // --- Инициализация ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let socket;

    function init() {
        document.getElementById('nickname').value = player.name;
        document.getElementById('trophy-count').innerText = player.trophies;
        renderDeckSelection();
        resize();
        window.addEventListener('resize', resize);
    }

    function resize() {
        const height = window.innerHeight;
        const width = Math.min(window.innerWidth, height * 0.6);
        canvas.width = width;
        canvas.height = height;
    }

    // --- Логика Меню ---
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function saveName() {
        player.name = document.getElementById('nickname').value;
        localStorage.setItem('royale_name', player.name);
    }

    function renderDeckSelection() {
        const container = document.getElementById('deck-list');
        container.innerHTML = '';
        UNITS_DATA.forEach(unit => {
            const div = document.createElement('div');
            div.className = `unit-card ${player.deck.includes(unit.id) ? 'selected' : ''}`;
            div.innerHTML = `<div class="cost">${unit.cost}</div><b>${unit.name}</b>`;
            div.onclick = () => {
                if (player.deck.includes(unit.id)) {
                    player.deck = player.deck.filter(id => id !== unit.id);
                } else if (player.deck.length < 5) {
                    player.deck.push(unit.id);
                }
                renderDeckSelection();
            };
            container.appendChild(div);
        });
    }

    // --- Сетевая логика ---
    function startMatch() {
        if (player.deck.length < 5) return alert("Выберите 5 карт!");
        
        document.getElementById('matchmaking-status').innerText = "Поиск противника...";
        
        // ВАЖНО: Укажите адрес вашего сервера
        socket = new WebSocket('ws://localhost:8080'); 

        socket.onopen = () => {
            socket.send(JSON.stringify({
                type: 'join',
                name: player.name,
                trophies: player.trophies,
                deck: player.deck
            }));
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.type === 'match_start') {
                gameState.role = data.role; // 'p1' или 'p2'
                document.getElementById('opp-name').innerText = data.oppName;
                document.getElementById('opp-trophies').innerText = data.oppTrophies;
                initBattle(data.seed);
            }
            
            if (data.type === 'sync') {
                gameState.units = data.units;
                gameState.towers = data.towers;
                gameState.timer = data.timer;
                gameState.suddenDeath = data.suddenDeath;
            }

            if (data.type === 'emoji') {
                showEmoji(data.emoji, data.isOpponent);
            }

            if (data.type === 'game_over') {
                endGame(data.winner === gameState.role);
            }
        };
    }

    // --- Логика Боя ---
    function initBattle() {
        gameState.isMatch = true;
        gameState.elixir = 5;
        gameState.units = [];
        gameState.hand = player.deck.slice(0, 4);
        gameState.queue = [player.deck[4]];
        
        document.getElementById('ui-layer').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        
        renderHand();
        gameLoop();
        
        // Накопление эликсира
        setInterval(() => {
            if (gameState.isMatch && gameState.elixir < 10) {
                gameState.elixir += gameState.suddenDeath ? 0.2 : 0.1;
                updateElixirUI();
            }
        }, 100);
    }

    function updateElixirUI() {
        document.getElementById('elixir-val').innerText = Math.floor(gameState.elixir);
        document.getElementById('elixir-progress').style.width = (gameState.elixir * 10) + '%';
    }

    function renderHand() {
        const handDiv = document.getElementById('player-hand');
        handDiv.innerHTML = '';
        gameState.hand.forEach((unitId, idx) => {
            const unit = UNITS_DATA[unitId];
            const card = document.createElement('div');
            card.className = `hand-card ${gameState.selectedCardIdx === idx ? 'active' : ''}`;
            card.innerHTML = `<span>${unit.cost}💧</span><b>${unit.name}</b>`;
            card.onclick = (e) => {
                e.stopPropagation();
                gameState.selectedCardIdx = (gameState.selectedCardIdx === idx) ? -1 : idx;
                renderHand();
            };
            handDiv.appendChild(card);
        });
    }

    canvas.addEventListener('mousedown', (e) => {
        if (!gameState.isMatch || gameState.selectedCardIdx === -1) return;
        
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / canvas.width;
        const y = (e.clientY - rect.top) / canvas.height;

        // Проверка: можно ставить только на свою половину
        const isBottomHalf = y > 0.5;
        const canPlace = (gameState.role === 'p1' && isBottomHalf) || (gameState.role === 'p2' && !isBottomHalf);

        if (canPlace) {
            const unitId = gameState.hand[gameState.selectedCardIdx];
            const unitData = UNITS_DATA[unitId];

            if (gameState.elixir >= unitData.cost) {
                gameState.elixir -= unitData.cost;
                
                // Отправка на сервер
                socket.send(JSON.stringify({
                    type: 'place_unit',
                    unitId: unitId,
                    x: x,
                    y: y
                }));

                // Ротация карт
                const playedId = gameState.hand.splice(gameState.selectedCardIdx, 1)[0];
                gameState.hand.push(gameState.queue.shift());
                gameState.queue.push(playedId);
                
                gameState.selectedCardIdx = -1;
                renderHand();
                updateElixirUI();
            }
        }
    });

    function toggleEmoji() {
        const p = document.getElementById('emoji-panel');
        p.style.display = p.style.display === 'grid' ? 'none' : 'grid';
    }

    function sendEmoji(emoji) {
        socket.send(JSON.stringify({ type: 'emoji', emoji: emoji }));
        toggleEmoji();
    }

    function showEmoji(emoji, isOpponent) {
        const emojiObj = {
            text: emoji,
            x: canvas.width / 2,
            y: isOpponent ? 100 : canvas.height - 100,
            life: 100
        };
        gameState.emojis.push(emojiObj);
    }

    // --- Отрисовка ---
    function gameLoop() {
        if (!gameState.isMatch) return;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Рисуем "Реку"
        ctx.fillStyle = '#3498db';
        ctx.fillRect(0, canvas.height/2 - 10, canvas.width, 20);

        // Отрисовка башен (упрощенно)
        gameState.towers.forEach(t => {
            ctx.fillStyle = t.owner === gameState.role ? '#3498db' : '#e74c3c';
            ctx.beginPath();
            ctx.arc(t.x * canvas.width, t.y * canvas.height, 20, 0, Math.PI*2);
            ctx.fill();
            // HP Bar
            ctx.fillStyle = 'black';
            ctx.fillRect(t.x * canvas.width - 20, t.y * canvas.height - 30, 40, 5);
            ctx.fillStyle = 'lime';
            ctx.fillRect(t.x * canvas.width - 20, t.y * canvas.height - 30, 40 * (t.hp / t.maxHp), 5);
        });

        // Отрисовка юнитов
        gameState.units.forEach(u => {
            const data = UNITS_DATA[u.unitId];
            ctx.fillStyle = u.owner === gameState.role ? 'blue' : 'red';
            ctx.beginPath();
            ctx.arc(u.x * canvas.width, u.y * canvas.height, 10, 0, Math.PI*2);
            ctx.fill();
            // Индикатор здоровья
            ctx.fillStyle = 'red';
            ctx.fillRect(u.x * canvas.width - 10, u.y * canvas.height - 15, 20, 3);
        });

        // Отрисовка эмодзи
        gameState.emojis.forEach((e, i) => {
            ctx.font = "40px serif";
            ctx.fillText(e.text, e.x, e.y);
            e.life--;
            if(e.life <= 0) gameState.emojis.splice(i, 1);
        });

        // Обновление таймера
        const mins = Math.floor(gameState.timer / 60);
        const secs = gameState.timer % 60;
        document.getElementById('match-timer').innerText = 
            `${mins}:${secs < 10 ? '0' : ''}${secs}${gameState.suddenDeath ? ' SD' : ''}`;

        requestAnimationFrame(gameLoop);
    }

    function endGame(isWin) {
        gameState.isMatch = false;
        const change = isWin ? 30 : -25;
        player.trophies = Math.max(0, player.trophies + change);
        localStorage.setItem('royale_trophies', player.trophies);

        document.getElementById('result-screen').style.display = 'flex';
        document.getElementById('res-title').innerText = isWin ? "ПОБЕДА!" : "ПОРАЖЕНИЕ";
        document.getElementById('res-details').innerText = `${isWin ? '+' : ''}${change} кубков (Всего: ${player.trophies})`;
    }

    init();
</script>
</body>
</html>
