<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>👑 Royale Clone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    body {
      background: #1a1e2b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    #game-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 900px;
      background: linear-gradient(145deg, #2a2f3f, #1f2230);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      padding: 10px;
      color: #f0e6d2;
    }
    .screen.active {
      display: flex;
    }
    .main-menu {
      gap: 10px;
      justify-content: flex-end;
    }
    .menu-bottom {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
      padding-bottom: 20px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      background: #232837;
      padding: 6px;
      border-radius: 24px;
      margin-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 5px;
      background: transparent;
      border: none;
      color: #9aa0b4;
      font-weight: bold;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: #4f5b72;
      color: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .panel {
      background: #232837;
      border-radius: 20px;
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .unit-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .unit-card {
      background: #2f354a;
      border-radius: 10px;
      padding: 6px;
      text-align: center;
      font-size: 11px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: 0.2s;
    }
    .unit-card.selected {
      border-color: #f7c948;
      background: #4a432f;
    }
    .unit-icon {
      font-size: 24px;
      display: block;
    }
    .queue-preview {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      background: #2a2f40;
      padding: 8px;
      border-radius: 12px;
    }
    .fight-btn {
      background: #e85d3a;
      border: none;
      color: white;
      font-weight: bold;
      padding: 20px;
      border-radius: 20px;
      font-size: 24px;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 6px 0 #8f2e1c;
      transition: 0.1s linear;
      width: 100%;
    }
    .fight-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #8f2e1c;
    }
    .fight-btn:disabled {
      background: #666;
      box-shadow: 0 6px 0 #444;
      cursor: not-allowed;
    }
    .search-status {
      color: #f7c948;
      text-align: center;
      font-size: 18px;
      display: none;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .profile-input {
      background: #2f354a;
      border: none;
      padding: 14px;
      border-radius: 16px;
      color: white;
      font-size: 16px;
      outline: none;
    }
    .cups-display {
      font-size: 32px;
      font-weight: bold;
      color: #f7c948;
      text-align: center;
    }
    .battle-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 8px;
      font-weight: bold;
      font-size: 13px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      margin-bottom: 5px;
    }
    .enemy-info {
      display: flex;
      flex-direction: column;
    }
    .timer {
      background: #1e212b;
      padding: 6px 16px;
      border-radius: 15px;
      font-size: 16px;
      color: #ffd966;
    }
    canvas {
      width: 100%;
      border-radius: 12px;
      background: #2b4a3b;
      display: block;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
      flex: 1;
    }
    .bottom-panel {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 5px;
      background: rgba(0,0,0,0.4);
      border-radius: 16px;
      padding: 8px;
    }
    .elixir-bar-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .elixir-fill {
      height: 12px;
      background: linear-gradient(90deg, #8b2fc9, #c24eff);
      border-radius: 8px;
      width: 0%;
      box-shadow: 0 0 10px #c24eff;
      transition: width 0.1s;
    }
    .elixir-bg {
      flex: 1;
      background: #2a2f3f;
      height: 12px;
      border-radius: 8px;
      overflow: hidden;
    }
    .elixir-number {
      font-weight: bold;
      color: #eac4ff;
      min-width: 40px;
      font-size: 16px;
    }
    .hand-cards {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .card-slot {
      background: #2d3245;
      border-radius: 12px;
      padding: 8px;
      text-align: center;
      flex: 1;
      max-width: 70px;
      border: 2px solid #5a5f72;
      transition: 0.2s;
      cursor: pointer;
      font-size: 13px;
    }
    .card-slot.highlight {
      border-color: #f7c948;
      box-shadow: 0 0 15px gold;
      transform: scale(1.05);
    }
    .emoji-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .emoji-btn {
      background: #3b4055;
      border: none;
      font-size: 22px;
      border-radius: 12px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .emoji-panel {
      display: none;
      gap: 8px;
      background: #1f2330;
      padding: 10px;
      border-radius: 20px;
      position: absolute;
      bottom: 160px;
      right: 10px;
      z-index: 20;
    }
    .emoji-item {
      font-size: 28px;
      cursor: pointer;
      padding: 4px;
    }
    .result-screen {
      justify-content: center;
      align-items: center;
      gap: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
<div id="game-container">
  <!-- Главное меню -->
  <div id="mainMenu" class="screen active main-menu">
    <div class="panel" id="menuContent">
      <div id="tabBattle" class="panel-content">
        <div style="text-align: center; padding: 40px 0;">
          <div style="font-size: 60px; margin-bottom: 10px;">👑</div>
          <div style="font-size: 24px; font-weight: bold; color: #f7c948;">BUM ROYALE</div>
        </div>
      </div>
      <div id="tabDeck" class="panel-content" style="display: none;">
        <div class="unit-grid" id="unitGrid"></div>
        <div class="queue-preview" id="queuePreview"></div>
      </div>
      <div id="tabProfile" class="panel-content" style="display: none;">
        <input type="text" id="nicknameInput" class="profile-input" placeholder="Введи никнейм" maxlength="16">
        <div class="cups-display">🏆 <span id="cupsCount">0</span></div>
        <button id="saveProfileBtn" style="background:#4f5b72; border:none; color:white; padding:14px; border-radius:16px; font-size:16px;">Сохранить</button>
      </div>
    </div>
    <div class="menu-bottom">
      <div class="tabs">
        <button class="tab-btn active" data-tab="battle">⚔️ Бой</button>
        <button class="tab-btn" data-tab="deck">🗂 Колода</button>
        <button class="tab-btn" data-tab="profile">👤 Профиль</button>
      </div>
      <button id="findMatchBtn" class="fight-btn">⚡ В БОЙ</button>
      <p id="searchStatus" class="search-status">🔍 Поиск соперника...</p>
    </div>
  </div>

  <!-- Экран боя -->
  <div id="battleScreen" class="screen" style="padding:5px; gap: 0;">
    <div class="battle-hud">
      <div class="enemy-info">
        <span id="enemyName">⚔️ Противник</span>
        <span id="enemyCups" style="font-size:11px; color:#f7c948;">🏆 0</span>
      </div>
      <span class="timer" id="timerDisplay">2:00</span>
    </div>
    <canvas id="battleCanvas" width="400" height="550"></canvas>
    <div class="bottom-panel">
      <div class="elixir-bar-container">
        <span style="font-size:18px;">💧</span>
        <div class="elixir-bg"><div id="elixirFill" class="elixir-fill" style="width: 0%;"></div></div>
        <span class="elixir-number" id="elixirValue">0.0</span>
      </div>
      <div class="emoji-row">
        <div class="hand-cards" id="handCards"></div>
        <button id="emojiToggle" class="emoji-btn">💬</button>
      </div>
    </div>
    <div class="emoji-panel" id="emojiPanel">
      <span class="emoji-item">👍</span><span class="emoji-item">👎</span><span class="emoji-item">❤️</span>
      <span class="emoji-item">😭</span><span class="emoji-item">🤣</span>
    </div>
  </div>

  <!-- Экран результата -->
  <div id="resultScreen" class="screen result-screen">
    <h2 id="resultTitle" style="font-size:36px;"></h2>
    <p id="resultCups" style="font-size:18px;"></p>
    <button id="exitResultBtn" style="background:#e85d3a; border:none; color:white; padding:16px 40px; border-radius:24px; font-weight:bold; font-size:20px;">ВЫХОД</button>
  </div>
</div>

<script>
  (function() {
    // ---------- ДАННЫЕ ЮНИТОВ (шарики разных цветов и размеров) ----------
    const ALL_UNITS = [
      { id: 'knight', name: 'Рыцарь', cost: 3, icon: '🟦', hp: 600, dmg: 80, speed: 0.8, size: 14, color: '#4a90d9', attackSpeed: 1.2, targets: 'all' },
      { id: 'archer', name: 'Лучница', cost: 2, icon: '🟩', hp: 250, dmg: 60, speed: 0.7, size: 10, color: '#5cb85c', attackSpeed: 1.0, targets: 'all' },
      { id: 'giant', name: 'Гигант', cost: 5, icon: '🟫', hp: 1800, dmg: 50, speed: 0.4, size: 20, color: '#8b6914', attackSpeed: 1.5, targets: 'buildings' },
      { id: 'goblin', name: 'Гоблин', cost: 1, icon: '🟢', hp: 150, dmg: 50, speed: 1.2, size: 8, color: '#32cd32', attackSpeed: 0.8, targets: 'all' },
      { id: 'wizard', name: 'Маг', cost: 4, icon: '🟣', hp: 400, dmg: 110, speed: 0.6, size: 12, color: '#9b59b6', attackSpeed: 1.3, targets: 'all' },
      { id: 'minipekka', name: 'Мини Пекка', cost: 3, icon: '🔵', hp: 700, dmg: 180, speed: 0.9, size: 13, color: '#34495e', attackSpeed: 1.4, targets: 'all' },
      { id: 'skeleton', name: 'Скелет', cost: 1, icon: '⚪', hp: 100, dmg: 45, speed: 1.0, size: 7, color: '#ecf0f1', attackSpeed: 0.7, targets: 'all' },
      { id: 'dragon', name: 'Дракон', cost: 4, icon: '🔴', hp: 550, dmg: 90, speed: 0.7, size: 16, color: '#e74c3c', attackSpeed: 1.1, targets: 'all' },
      { id: 'prince', name: 'Принц', cost: 4, icon: '🟡', hp: 650, dmg: 140, speed: 1.0, size: 15, color: '#f39c12', attackSpeed: 1.3, targets: 'all' },
      { id: 'bomber', name: 'Бомбер', cost: 2, icon: '⚫', hp: 200, dmg: 100, speed: 0.5, size: 11, color: '#2c3e50', attackSpeed: 1.6, targets: 'all' }
    ];

    // Мосты
    const BRIDGES = [
      { x: 60, y: 245, width: 40, height: 60 },
      { x: 300, y: 245, width: 40, height: 60 }
    ];

    // ---------- СОСТОЯНИЕ ----------
    let deck = [];
    let battleDeck = [];
    let activeHand = [];
    let queueCard = null;
    let elixir = 0;
    let maxElixir = 10;
    let elixirRate = 0.28;
    let gameTime = 120;
    let suddenDeath = false;
    let matchActive = false;
    let playerNick = 'Игрок';
    let opponentNick = 'Противник';
    let opponentCups = 0;
    let cups = 0;
    let playerTowers = [];
    let enemyTowers = [];
    let units = [];
    let playerId = null;
    let opponentId = null;
    let ws = null;
    let selectedCardIndex = null;
    let searchingMatch = false;

    // DOM элементы
    const mainMenu = document.getElementById('mainMenu');
    const battleScreen = document.getElementById('battleScreen');
    const resultScreen = document.getElementById('resultScreen');
    const canvas = document.getElementById('battleCanvas');
    const ctx = canvas.getContext('2d');
    let animationFrameId = null;
    let lastTimestamp = 0;

    // ---------- ИНИЦИАЛИЗАЦИЯ ----------
    function loadProfile() {
      playerNick = localStorage.getItem('royaleNick') || 'Игрок';
      cups = parseInt(localStorage.getItem('royaleCups') || '0');
      document.getElementById('nicknameInput').value = playerNick;
      document.getElementById('cupsCount').textContent = cups;
    }
    
    function saveProfile() {
      localStorage.setItem('royaleNick', playerNick);
      localStorage.setItem('royaleCups', cups);
    }

    function initDeck() {
      if (deck.length === 0) deck = [0,1,2,3,4];
      renderDeckGrid();
      updateQueuePreview();
    }

    function renderDeckGrid() {
      const grid = document.getElementById('unitGrid');
      grid.innerHTML = '';
      ALL_UNITS.forEach((unit, idx) => {
        const card = document.createElement('div');
        card.className = 'unit-card' + (deck.includes(idx) ? ' selected' : '');
        card.innerHTML = `<span class="unit-icon">${unit.icon}</span>${unit.name}<br>💰${unit.cost}`;
        card.onclick = () => toggleDeckUnit(idx);
        grid.appendChild(card);
      });
    }

    function toggleDeckUnit(idx) {
      if (deck.includes(idx)) {
        if (deck.length <= 5) return;
        deck = deck.filter(i => i !== idx);
      } else {
        if (deck.length >= 5) deck.shift();
        deck.push(idx);
      }
      renderDeckGrid();
      updateQueuePreview();
    }

    function updateQueuePreview() {
      const preview = document.getElementById('queuePreview');
      if (!deck.length) return;
      const queueUnit = ALL_UNITS[deck[4]];
      preview.innerHTML = `<span>⏳ Очередь: ${queueUnit.icon} ${queueUnit.name} (💰${queueUnit.cost})</span>`;
    }

    // ---------- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ----------
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.querySelectorAll('.panel-content').forEach(p => p.style.display = 'none');
        document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).style.display = 'block';
      });
    });

    document.getElementById('saveProfileBtn').onclick = () => {
      playerNick = document.getElementById('nicknameInput').value.trim() || 'Игрок';
      saveProfile();
      document.getElementById('cupsCount').textContent = cups;
    };

    // ---------- WEBSOCKET ----------
    function connectWebSocket() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = window.location.host;
      console.log('🔌 Подключение к WebSocket:', `${protocol}//${host}`);
      
      try {
        ws = new WebSocket(`${protocol}//${host}`);
        ws.onopen = () => {
          console.log('✅ WebSocket подключен');
          if (!playerId) {
            playerId = localStorage.getItem('royalePlayerId');
            if (!playerId) {
              playerId = 'p_' + Math.random().toString(36).substr(2, 9);
              localStorage.setItem('royalePlayerId', playerId);
            }
          }
          send({ type: 'setId', id: playerId, nick: playerNick, cups: cups });
          if (searchingMatch) startSearching();
        };
        
        ws.onmessage = (e) => {
          try {
            const msg = JSON.parse(e.data);
            handleMessage(msg);
          } catch (error) {
            console.error('Ошибка обработки сообщения:', error);
          }
        };
        
        ws.onerror = (error) => {
          console.error('❌ Ошибка WebSocket:', error);
          stopSearching();
        };
        
        ws.onclose = () => {
          console.log('🔌 WebSocket отключен');
          stopSearching();
          setTimeout(connectWebSocket, 2000);
        };
      } catch (error) {
        console.error('Ошибка создания WebSocket:', error);
        setTimeout(connectWebSocket, 3000);
      }
    }

    function handleMessage(msg) {
      switch(msg.type) {
        case 'idAssigned':
          playerId = msg.id;
          break;
        case 'matchFound':
          opponentId = msg.opponent;
          opponentNick = msg.opponentNick || 'Противник';
          opponentCups = msg.opponentCups || 0;
          stopSearching();
          startBattle();
          break;
        case 'gameState':
          updateRemoteState(msg);
          break;
        case 'emoji':
          displayEmoji(msg.emoji, msg.from);
          break;
        case 'battleEnd':
          endBattle(msg.result, msg.winner);
          break;
      }
    }

    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      } else {
        connectWebSocket();
        setTimeout(() => {
          if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
        }, 500);
      }
    }

    // ---------- ПОИСК МАТЧА ----------
    function startSearching() {
      searchingMatch = true;
      document.getElementById('searchStatus').style.display = 'block';
      document.getElementById('findMatchBtn').disabled = true;
      if (ws && ws.readyState === WebSocket.OPEN) {
        send({ type: 'findMatch', nick: playerNick, cups: cups });
      } else {
        connectWebSocket();
        setTimeout(() => {
          if (ws && ws.readyState === WebSocket.OPEN) send({ type: 'findMatch', nick: playerNick, cups: cups });
        }, 1000);
      }
    }
    
    function stopSearching() {
      searchingMatch = false;
      document.getElementById('searchStatus').style.display = 'none';
      document.getElementById('findMatchBtn').disabled = false;
    }

    document.getElementById('findMatchBtn').onclick = () => {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        connectWebSocket();
        setTimeout(() => { if (ws && ws.readyState === WebSocket.OPEN) startSearching(); }, 800);
      } else {
        startSearching();
      }
    };

    // ---------- БОЙ ----------
    function startBattle() {
      battleDeck = [...deck];
      activeHand = battleDeck.slice(0,4).map(idx => ({...ALL_UNITS[idx], attackTimer: 0}));
      queueCard = {...ALL_UNITS[battleDeck[4]], attackTimer: 0};
      elixir = 0;
      gameTime = 120;
      suddenDeath = false;
      matchActive = true;
      units = [];
      initTowers();
      
      document.getElementById('enemyName').textContent = `👤 ${opponentNick}`;
      document.getElementById('enemyCups').textContent = `🏆 ${opponentCups}`;
      document.getElementById('timerDisplay').textContent = '2:00';
      document.getElementById('elixirValue').textContent = '0.0';
      document.getElementById('elixirFill').style.width = '0%';
      
      mainMenu.classList.remove('active');
      battleScreen.classList.add('active');
      resultScreen.classList.remove('active');
      
      renderHand();
      
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      lastTimestamp = performance.now();
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function initTowers() {
      // Квадратные башни: главная больше, боковые меньше
      playerTowers = [
        { x: 60, y: 470, w: 30, h: 30, hp: 800, maxHp: 800, type: 'side', owner: 'player' },
        { x: 185, y: 490, w: 45, h: 45, hp: 1500, maxHp: 1500, type: 'main', owner: 'player' },
        { x: 310, y: 470, w: 30, h: 30, hp: 800, maxHp: 800, type: 'side', owner: 'player' }
      ];
      enemyTowers = [
        { x: 60, y: 50, w: 30, h: 30, hp: 800, maxHp: 800, type: 'side', owner: 'enemy' },
        { x: 185, y: 15, w: 45, h: 45, hp: 1500, maxHp: 1500, type: 'main', owner: 'enemy' },
        { x: 310, y: 50, w: 30, h: 30, hp: 800, maxHp: 800, type: 'side', owner: 'enemy' }
      ];
    }

    function renderHand() {
      const container = document.getElementById('handCards');
      container.innerHTML = '';
      activeHand.forEach((card, i) => {
        const div = document.createElement('div');
        div.className = 'card-slot' + (selectedCardIndex === i ? ' highlight' : '');
        div.innerHTML = `${card.icon}<br>💰${card.cost}`;
        div.onclick = () => {
          selectedCardIndex = (selectedCardIndex === i) ? null : i;
          renderHand();
        };
        container.appendChild(div);
      });
    }

    function cycleHand(usedIndex) {
      const usedCard = activeHand[usedIndex];
      activeHand.splice(usedIndex, 1);
      activeHand.push(queueCard);
      queueCard = usedCard;
      selectedCardIndex = null;
      renderHand();
    }

    // Проверка, находится ли точка на мосту или рядом с ним
    function isOnBridge(x, y) {
      for (let bridge of BRIDGES) {
        if (x >= bridge.x && x <= bridge.x + bridge.width &&
            y >= bridge.y && y <= bridge.y + bridge.height) {
          return true;
        }
      }
      return false;
    }

    // Проверка, может ли юнит пересечь реку
    function canCrossRiver(unit) {
      // Юниты могут переходить реку только по мостам
      for (let bridge of BRIDGES) {
        if (unit.x >= bridge.x - 10 && unit.x <= bridge.x + bridge.width + 10 &&
            unit.y >= bridge.y - 10 && unit.y <= bridge.y + bridge.height + 10) {
          return true;
        }
      }
      return false;
    }

    canvas.addEventListener('click', (e) => {
      if (!matchActive || selectedCardIndex === null) return;
      
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;
      
      // Можно размещать только на своей половине (нижняя часть, ниже реки)
      if (mouseY < 295) return;
      
      const card = activeHand[selectedCardIndex];
      if (elixir < card.cost) return;
      
      elixir -= card.cost;
      
      const newUnit = {
        ...card,
        id: Math.random().toString(36),
        x: mouseX,
        y: mouseY,
        hp: card.hp,
        maxHp: card.hp,
        owner: 'player',
        attackTimer: 0,
        target: null,
        color: card.color,
        size: card.size
      };
      
      units.push(newUnit);
      cycleHand(selectedCardIndex);
      
      send({ type: 'placeUnit', unit: newUnit, x: mouseX, y: mouseY });
    });

    function updateRemoteState(msg) {
      if (!matchActive) return;
      if (msg.units) {
        units = units.filter(u => u.owner === 'player');
        const enemyUnits = msg.units.filter(u => u.owner === 'enemy').map(u => ({...u, attackTimer: u.attackTimer || 0}));
        units.push(...enemyUnits);
      }
      if (msg.towers && msg.towers.enemy) {
        enemyTowers = msg.towers.enemy.map(t => ({...t, w: t.w || 30, h: t.h || 30}));
      }
    }

    function displayEmoji(emoji, from) {
      const tower = from === playerId ? playerTowers[1] : enemyTowers[1];
      if (tower) tower.emoji = { symbol: emoji, timer: 2.0 };
    }

    document.getElementById('emojiToggle').onclick = () => {
      const panel = document.getElementById('emojiPanel');
      panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
    };
    
    document.querySelectorAll('.emoji-item').forEach(el => {
      el.onclick = () => {
        const emoji = el.textContent;
        displayEmoji(emoji, playerId);
        send({ type: 'emoji', emoji });
        document.getElementById('emojiPanel').style.display = 'none';
      };
    });

    function findTarget(unit) {
      const enemies = units.filter(u => u.owner !== unit.owner && u.hp > 0);
      const enemyTowersList = unit.owner === 'player' ? enemyTowers : playerTowers;
      
      // Для юнитов с приоритетом buildings - сразу ищем башни
      if (unit.targets === 'buildings') {
        let closest = null;
        let minDist = Infinity;
        enemyTowersList.forEach(t => {
          if (t.hp <= 0) return;
          const dx = t.x + t.w/2 - unit.x;
          const dy = t.y + t.h/2 - unit.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < minDist) { minDist = dist; closest = t; }
        });
        return closest;
      }
      
      // Ищем ближайшего вражеского юнита
      let closestEnemy = null;
      let minDist = Infinity;
      enemies.forEach(e => {
        const dx = e.x - unit.x;
        const dy = e.y - unit.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < minDist && dist < 150) { // Агро-радиус 150
          minDist = dist;
          closestEnemy = e;
        }
      });
      
      if (closestEnemy) return closestEnemy;
      
      // Если врагов рядом нет - идем к башням
      let closestTower = null;
      minDist = Infinity;
      enemyTowersList.forEach(t => {
        if (t.hp <= 0) return;
        const dx = t.x + t.w/2 - unit.x;
        const dy = t.y + t.h/2 - unit.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < minDist) { minDist = dist; closestTower = t; }
      });
      return closestTower;
    }

    function gameLoop(ts) {
      if (!matchActive) return;
      
      const dt = Math.min((ts - lastTimestamp) / 1000, 0.1);
      lastTimestamp = ts;
      
      gameTime -= dt;
      
      if (gameTime <= 0) {
        if (!suddenDeath && checkMainTowersIntact()) {
          suddenDeath = true;
          gameTime = 60;
          elixirRate = 0.56;
        } else {
          endBattleByTimeout();
          return;
        }
      }
      
      const rate = suddenDeath ? 0.56 : 0.28;
      elixir = Math.min(maxElixir, elixir + rate * dt);
      
      updateUnits(dt);
      checkTowerDestruction();
      drawCanvas();
      updateHUD();
      
      if (matchActive) {
        animationFrameId = requestAnimationFrame(gameLoop);
      }
    }

    function updateUnits(dt) {
      units.forEach(u => {
        if (u.hp <= 0) return;
        
        // Уменьшаем таймер атаки
        if (u.attackTimer > 0) u.attackTimer -= dt;
        
        const target = findTarget(u);
        u.target = target;
        
        if (target) {
          let targetX, targetY, targetW, targetH;
          
          if (target.hp !== undefined && target.maxHp !== undefined) {
            // Это юнит или башня
            targetX = target.x || (target.x !== undefined ? target.x : 0);
            targetY = target.y || (target.y !== undefined ? target.y : 0);
            targetW = target.w || target.size || 20;
            targetH = target.h || target.size || 20;
          }
          
          const dx = targetX - u.x;
          const dy = targetY - u.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          const attackRange = 30;
          
          if (dist > attackRange) {
            // Движение к цели
            let newX = u.x + (dx/dist) * u.speed * 60 * dt;
            let newY = u.y + (dy/dist) * u.speed * 60 * dt;
            
            // Проверка реки (y=250 до y=310)
            const crossingRiver = (u.y < 280 && newY > 280) || (u.y > 280 && newY < 280);
            if (crossingRiver && !canCrossRiver(u)) {
              // Не может перейти реку, ищем ближайший мост
              let closestBridge = null;
              let minBridgeDist = Infinity;
              for (let bridge of BRIDGES) {
                const bx = bridge.x + bridge.width/2;
                const by = bridge.y + bridge.height/2;
                const bdist = Math.sqrt((bx-u.x)**2 + (by-u.y)**2);
                if (bdist < minBridgeDist) {
                  minBridgeDist = bdist;
                  closestBridge = {x: bx, y: by};
                }
              }
              if (closestBridge) {
                const bdx = closestBridge.x - u.x;
                const bdy = closestBridge.y - u.y;
                const bdist2 = Math.sqrt(bdx*bdx + bdy*bdy);
                newX = u.x + (bdx/bdist2) * u.speed * 60 * dt;
                newY = u.y + (bdy/bdist2) * u.speed * 60 * dt;
              }
            }
            
            u.x = newX;
            u.y = newY;
          } else if (u.attackTimer <= 0) {
            // Атака с задержкой
            target.hp -= u.dmg;
            u.attackTimer = u.attackSpeed;
          }
        }
      });
      
      // Удаляем мертвых
      units = units.filter(u => u.hp > 0);
      playerTowers = playerTowers.filter(t => t.hp > 0);
      enemyTowers = enemyTowers.filter(t => t.hp > 0);
      
      // Отправляем состояние
      if (Math.random() < 0.1) { // ~6 раз в секунду при 60fps
        send({ 
          type: 'stateUpdate', 
          units: units.filter(u => u.owner === 'player'), 
          towers: { player: playerTowers } 
        });
      }
    }

    function checkTowerDestruction() {
      const playerMain = playerTowers.find(t => t.type === 'main');
      const enemyMain = enemyTowers.find(t => t.type === 'main');
      
      if (enemyMain && enemyMain.hp <= 0) endBattle('win');
      if (playerMain && playerMain.hp <= 0) endBattle('lose');
    }

    function checkMainTowersIntact() {
      const playerMain = playerTowers.find(t => t.type === 'main');
      const enemyMain = enemyTowers.find(t => t.type === 'main');
      return playerMain && enemyMain && playerMain.hp > 0 && enemyMain.hp > 0;
    }

    function endBattleByTimeout() {
      const playerMain = playerTowers.find(t => t.type === 'main');
      const enemyMain = enemyTowers.find(t => t.type === 'main');
      
      if (!playerMain || !enemyMain) { endBattle('draw'); return; }
      
      if (playerMain.hp > enemyMain.hp) endBattle('win');
      else if (enemyMain.hp > playerMain.hp) endBattle('lose');
      else endBattle('draw');
    }

    function endBattle(result, winnerId) {
      if (!matchActive) return;
      matchActive = false;
      
      if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
      
      let change = 0;
      if (result === 'win') { cups += 30; change = 30; }
      else if (result === 'lose') { cups = Math.max(0, cups - 25); change = -25; }
      
      saveProfile();
      
      document.getElementById('resultTitle').textContent = 
        result === 'win' ? '🏆 Победа!' : (result === 'lose' ? '💔 Поражение' : '🤝 Ничья');
      document.getElementById('resultCups').textContent = 
        `${playerNick} 🏆${cups} (${change>0?'+':''}${change}) vs ${opponentNick}`;
      
      battleScreen.classList.remove('active');
      resultScreen.classList.add('active');
      
      send({ type: 'battleEnd', result });
    }

    function drawCanvas() {
      ctx.clearRect(0, 0, 400, 550);
      
      // Трава
      ctx.fillStyle = '#3a5a3a';
      ctx.fillRect(0, 0, 400, 550);
      
      // Река (широкая, с мостами)
      ctx.fillStyle = '#2f6f8f';
      ctx.fillRect(0, 250, 400, 60);
      
      // Мосты
      ctx.fillStyle = '#8b6914';
      BRIDGES.forEach(bridge => {
        ctx.fillRect(bridge.x, bridge.y, bridge.width, bridge.height);
        // Текстура моста
        ctx.strokeStyle = '#5c4a1e';
        ctx.lineWidth = 2;
        for (let i = 0; i < bridge.height; i += 8) {
          ctx.beginPath();
          ctx.moveTo(bridge.x, bridge.y + i);
          ctx.lineTo(bridge.x + bridge.width, bridge.y + i);
          ctx.stroke();
        }
      });
      
      // Башни (квадратные)
      [...enemyTowers, ...playerTowers].forEach(t => {
        if (t.hp <= 0) return;
        
        // Тень
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(t.x + 2, t.y + 2, t.w, t.h);
        
        // Башня
        ctx.fillStyle = t.owner === 'player' ? '#4a7db0' : '#c94b4b';
        ctx.fillRect(t.x, t.y, t.w, t.h);
        
        // Зубцы на главной башне
        if (t.type === 'main') {
          ctx.fillStyle = t.owner === 'player' ? '#5a8dc0' : '#d95b5b';
          for (let i = 0; i < 5; i++) {
            ctx.fillRect(t.x + i*9, t.y - 6, 7, 6);
          }
        }
        
        // HP bar
        ctx.fillStyle = '#333';
        ctx.fillRect(t.x - 2, t.y - 16, t.w + 4, 6);
        ctx.fillStyle = '#2ecc71';
        const hpPercent = t.hp / t.maxHp;
        ctx.fillRect(t.x - 2, t.y - 16, (t.w + 4) * hpPercent, 6);
        
        ctx.fillStyle = 'white';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText(Math.ceil(t.hp), t.x + t.w/2 - 12, t.y - 20);
        
        if (t.emoji) {
          ctx.font = '22px sans-serif';
          ctx.fillText(t.emoji.symbol, t.x + t.w/2 - 11, t.y - 28);
          t.emoji.timer -= 0.016;
          if (t.emoji.timer <= 0) t.emoji = null;
        }
      });
      
      // Юниты (шарики)
      units.forEach(u => {
        if (u.hp <= 0) return;
        
        // Тень
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.arc(u.x + 2, u.y + 2, u.size, 0, 2 * Math.PI);
        ctx.fill();
        
        // Шарик
        ctx.fillStyle = u.color;
        ctx.beginPath();
        ctx.arc(u.x, u.y, u.size, 0, 2 * Math.PI);
        ctx.fill();
        
        // Обводка
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // HP bar
        ctx.fillStyle = '#333';
        ctx.fillRect(u.x - u.size, u.y - u.size - 10, u.size * 2, 4);
        ctx.fillStyle = '#2ecc71';
        const hpPercent = u.hp / u.maxHp;
        ctx.fillRect(u.x - u.size, u.y - u.size - 10, u.size * 2 * hpPercent, 4);
        
        // Иконка внутри шарика
        ctx.fillStyle = 'white';
        ctx.font = `${u.size}px sans-serif`;
        ctx.fillText(u.icon, u.x - u.size/2, u.y + u.size/3);
      });
    }

    function updateHUD() {
      const minutes = Math.floor(gameTime / 60);
      const seconds = Math.floor(gameTime % 60);
      document.getElementById('timerDisplay').textContent = 
        `${minutes}:${String(seconds).padStart(2, '0')}`;
      document.getElementById('elixirValue').textContent = elixir.toFixed(1);
      document.getElementById('elixirFill').style.width = (elixir / maxElixir * 100) + '%';
    }

    document.getElementById('exitResultBtn').onclick = () => {
      resultScreen.classList.remove('active');
      mainMenu.classList.add('active');
      document.getElementById('cupsCount').textContent = cups;
      stopSearching();
    };

    // Инициализация
    loadProfile();
    initDeck();
    connectWebSocket();
  })();
</script>
